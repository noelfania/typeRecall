id: language-bash-shell-linux
category: syntax
kind: command
language: shell
track:
  id: bash-shell
  label: Bash / Shell
title: P03.리눅스-실무
source:
  origin: assets/typingSource/Language-bash-Shell/리눅스 숙련 커리큘럼.md
  note: 마크다운 문서를 명령 단위 파트로 재구성. git 기본 명령 블록은 Git 트랙 P01과 중복이라 제외 (2026-07-09)
parts:
  - id: language-bash-shell-linux-part-1
    title: 주요 경로[filesystem layout]
    display: |-
      # 주요 경로[filesystem layout]
      /etc              # 설정 파일 (nginx.conf, hosts)
      /var/log          # 시스템·앱 로그
      /tmp              # 임시 파일 (재부팅 시 삭제)
      /usr/local/bin    # 직접 설치한 툴
      /home/user        # 일반 사용자 홈 (~)
      /proc             # 실행 중 프로세스 정보 (가상)
    typing: |-
      /etc
      /var/log
      /tmp
      /usr/local/bin
      /home/user
      /proc
  - id: language-bash-shell-linux-part-2
    title: 탐색[navigation]
    display: |-
      # 탐색[navigation]
      pwd               # 현재 경로 출력
      ls -al            # 숨김파일 포함 상세 목록
      cd ~/project      # 디렉토리 이동
      cd -              # 이전 디렉토리로 이동
    typing: |-
      pwd
      ls -al
      cd ~/project
      cd -
  - id: language-bash-shell-linux-part-3
    title: 파일 조작[file operation]
    display: |-
      # 파일 조작[file operation]
      touch file.txt          # 파일 생성
      mkdir -p a/b/c          # 중첩 폴더 한번에 생성
      cp -r dir1 dir2         # 폴더 복사 (-r 필수)
      mv file.txt docs/       # 이동 / 이름 변경
      rm -rf folder           # 폴더 강제 삭제 (주의!)
    typing: |-
      touch file.txt
      mkdir -p a/b/c
      cp -r dir1 dir2
      mv file.txt docs/
      rm -rf folder
  - id: language-bash-shell-linux-part-4
    title: 파일 내용 보기[view file]
    display: |-
      # 파일 내용 보기[view file]
      cat file.txt            # 전체 출력
      less file.txt           # 페이지 단위로 보기 (q로 종료)
      head -n 20 file.txt     # 앞 20줄
      tail -n 50 app.log      # 마지막 50줄
      tail -f app.log         # 실시간 로그 스트리밍 (서버 필수)
    typing: |-
      cat file.txt
      less file.txt
      head -n 20 file.txt
      tail -n 50 app.log
      tail -f app.log
  - id: language-bash-shell-linux-part-5
    title: 검색[grep / find]
    display: |-
      # 검색[grep / find]
      grep -rn "keyword" src               # 재귀 + 줄번호 검색
      find . -name "*.ts"                  # 확장자로 파일 찾기
      find . -type d -name "node_modules"  # 폴더 타입으로 찾기
      find . -name "*.ts" | xargs grep "api"   # 찾은 파일에서 검색
    typing: |-
      grep -rn "keyword" src
      find . -name "*.ts"
      find . -type d -name "node_modules"
      find . -name "*.ts" | xargs grep "api"
  - id: language-bash-shell-linux-part-6
    title: 권한[permission]
    display: |-
      # 권한[permission]
      ls -l                   # 권한 확인
      chmod +x script.sh      # 실행 권한 추가 (심볼 방식)
      chmod 755 file.sh       # rwxr-xr-x (숫자 방식)
      chown user:group file   # 소유자 변경
    typing: |-
      ls -l
      chmod +x script.sh
      chmod 755 file.sh
      chown user:group file
  - id: language-bash-shell-linux-part-7
    title: 사용자[user]
    display: |-
      # 사용자[user]
      whoami          # 현재 사용자 확인
      id              # UID, GID 확인
      sudo command    # root 권한으로 실행
      su - username   # 다른 사용자로 전환
    typing: |-
      whoami
      id
      sudo command
      su - username
  - id: language-bash-shell-linux-part-8
    title: 프로세스[process]
    display: |-
      # 프로세스[process]
      ps aux | grep node  # 특정 프로세스 검색
      top                 # 실시간 모니터링
      kill 1234           # PID로 종료
      kill -9 1234        # 강제 종료 (SIGKILL)
    typing: |-
      ps aux | grep node
      top
      kill 1234
      kill -9 1234
  - id: language-bash-shell-linux-part-9
    title: 디스크 용량[disk usage]
    display: |-
      # 디스크 용량[disk usage]
      df -h           # 전체 디스크 사용량 (human-readable)
      du -sh *        # 현재 폴더 항목별 용량
    typing: |-
      df -h
      du -sh *
  - id: language-bash-shell-linux-part-10
    title: 압축[tar / zip]
    display: |-
      # 압축[tar / zip]
      tar -czvf backup.tar.gz folder    # 압축 생성
      tar -xzvf backup.tar.gz           # 압축 해제
      zip -r archive.zip folder         # zip 압축
      unzip archive.zip                 # zip 해제
    typing: |-
      tar -czvf backup.tar.gz folder
      tar -xzvf backup.tar.gz
      zip -r archive.zip folder
      unzip archive.zip
  - id: language-bash-shell-linux-part-11
    title: 네트워크[network]
    display: |-
      # 네트워크[network]
      curl -I https://google.com       # 헤더만 확인
      curl -X POST -d '{}' url         # POST 요청
      ssh -p 2222 user@server          # 포트 지정 접속
      scp file.txt user@server:~/      # 서버로 파일 전송
    typing: |-
      curl -I https://google.com
      curl -X POST -d '{}' url
      ssh -p 2222 user@server
      scp file.txt user@server:~/
  - id: language-bash-shell-linux-part-12
    title: 패키지 관리[apt]
    display: |-
      # 패키지 관리[apt] (Ubuntu / Debian)
      sudo apt update                  # 목록 갱신 (설치 전 필수)
      sudo apt install nodejs          # 설치
      sudo apt remove nginx            # 제거
      apt list --installed             # 설치된 패키지 목록
    typing: |-
      sudo apt update
      sudo apt install nodejs
      sudo apt remove nginx
      apt list --installed
  - id: language-bash-shell-linux-part-13
    title: 서비스 관리[systemd]
    display: |-
      # 서비스 관리[systemd]
      sudo systemctl status nginx       # 상태 확인
      sudo systemctl restart nginx      # 재시작
      sudo systemctl enable nginx       # 부팅 시 자동 시작
      journalctl -u nginx -f            # 서비스 로그 실시간
    typing: |-
      sudo systemctl status nginx
      sudo systemctl restart nginx
      sudo systemctl enable nginx
      journalctl -u nginx -f
  - id: language-bash-shell-linux-part-14
    title: 셸 설정[shell config]
    display: |-
      # 셸 설정[shell config]
      # ~/.bashrc: bash 실행 시마다 / ~/.bash_profile: 로그인 시 1회
      source ~/.bashrc                # 설정 다시 읽기
      alias gs="git status"           # 자주 쓰는 명령 단축
      alias ll="ls -al"
    typing: |-
      source ~/.bashrc
      alias gs="git status"
      alias ll="ls -al"
  - id: language-bash-shell-linux-part-15
    title: 환경 변수[environment variable]
    display: |-
      # 환경 변수[environment variable]
      export PATH=$PATH:/usr/local/bin   # PATH에 경로 추가
      export NODE_ENV=production         # 변수 설정
      echo $PATH                         # 변수 확인
      env                                # 전체 출력
    typing: |-
      export PATH=$PATH:/usr/local/bin
      export NODE_ENV=production
      echo $PATH
      env
  - id: language-bash-shell-linux-part-16
    title: 스크립트 변수[script variable]
    display: |-
      #!/bin/bash
      # 스크립트 변수[script variable] — = 양옆 공백 금지
      NAME="linux"
      echo "hello $NAME"
    typing: |-
      NAME="linux"
      echo "hello $NAME"
  - id: language-bash-shell-linux-part-17
    title: 조건문[if]
    display: |-
      # 조건문[if] — -f 는 파일 존재 검사
      if [ -f "file.txt" ]; then
        echo "파일 있음"
      fi
    typing: |-
      if [ -f "file.txt" ]; then
        echo "파일 있음"
      fi
  - id: language-bash-shell-linux-part-18
    title: 반복문[for]
    display: |-
      # 반복문[for] — 글롭 패턴 순회
      for file in *.ts; do
        echo $file
      done
    typing: |-
      for file in *.ts; do
        echo $file
      done
  - id: language-bash-shell-linux-part-19
    title: 스크립트 실행[run script]
    display: |-
      # 스크립트 실행[run script]
      chmod +x script.sh   # 실행 권한 부여
      ./script.sh          # 실행
    typing: |-
      chmod +x script.sh
      ./script.sh
  - id: language-bash-shell-linux-part-20
    title: 도커 기본[docker]
    display: |-
      # 도커 기본[docker]
      docker ps -a                       # 전체 컨테이너
      docker run -d -p 80:80 nginx       # 백그라운드 + 포트 매핑
      docker exec -it container_id bash  # 내부 접속
      docker logs container_id           # 로그
      docker compose up -d               # compose 실행
    typing: |-
      docker ps -a
      docker run -d -p 80:80 nginx
      docker exec -it container_id bash
      docker logs container_id
      docker compose up -d
  - id: language-bash-shell-linux-part-21
    title: 파이프와 리다이렉션[pipe / redirection]
    display: |-
      # 파이프와 리다이렉션[pipe / redirection]
      cat log.txt | grep "error" | tail -20   # 명령 연결
      echo "hello" > file.txt     # 덮어쓰기
      echo "world" >> file.txt    # 이어쓰기
      cat file.txt 2>/dev/null    # 에러 출력 버리기
    typing: |-
      cat log.txt | grep "error" | tail -20
      echo "hello" > file.txt
      echo "world" >> file.txt
      cat file.txt 2>/dev/null
  - id: language-bash-shell-linux-part-22
    title: 히스토리[history]
    display: |-
      # 히스토리[history]
      history | grep git  # 기록에서 검색
      !!                  # 직전 명령어 재실행
      # Ctrl+R: 히스토리 검색 / Ctrl+C: 중단 / Ctrl+L: 화면 지우기
    typing: |-
      history | grep git
      !!
  - id: language-bash-shell-linux-part-23
    title: tmux 기본[tmux]
    display: |-
      # tmux 기본[tmux] — 세션 유지 다중 터미널
      tmux new                # 새 세션
      tmux ls                 # 세션 목록
      tmux attach -t 0        # 세션 재접속
      # Ctrl+B, D: 세션 분리 / Ctrl+B, C: 새 창
    typing: |-
      tmux new
      tmux ls
      tmux attach -t 0
  - id: language-bash-shell-linux-part-24
    title: 서버 디버깅 루틴[debug routine]
    display: |-
      # 서버 디버깅 루틴[debug routine]
      ps aux | grep node          # 프로세스 확인
      grep -r "ERROR" /var/log/   # 에러 로그 검색
      df -h                       # 디스크 여유 확인
      curl http://localhost:3000  # API 직접 확인
    typing: |-
      ps aux | grep node
      grep -r "ERROR" /var/log/
      df -h
      curl http://localhost:3000
  - id: language-bash-shell-linux-part-25
    title: 배포 루틴[deploy routine]
    display: |-
      # 배포 루틴[deploy routine]
      git pull
      npm run build
      sudo systemctl restart app
      tail -f /var/log/app.log    # 배포 후 로그 확인
    typing: |-
      git pull
      npm run build
      sudo systemctl restart app
      tail -f /var/log/app.log
