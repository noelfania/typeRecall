id: language-bash-shell-p02
category: syntax
kind: command
language: shell
track:
  id: bash-shell
  label: Bash / Shell
title: P02.실무-패턴
source:
  origin: assets/typingSource/Language-bash-Shell/P02.실무-패턴.sh
parts:
  - id: language-bash-shell-p02-part-1
    title: 현재 셸 프로세스 확인[current shell process]
    display: |-
      # 현재 셸 프로세스 확인[current shell process]
      ps -p $$
      # 결과: 현재 셸 PID 출력
    typing: ps -p $$
  - id: language-bash-shell-p02-part-2
    title: 여러 파일 한 번에 생성[brace expansion]
    display: |-
      # 여러 파일 한 번에 생성[brace expansion]
      touch log_{a,b,c}.txt
      # 결과: log_a.txt log_b.txt log_c.txt 생성
    typing: touch log_{a,b,c}.txt
  - id: language-bash-shell-p02-part-3
    title: 와일드카드[glob]
    display: |-
      # 와일드카드[glob]
      ls *.txt
      # 결과: .txt 파일만 출력
    typing: ls *.txt
  - id: language-bash-shell-p02-part-4
    title: 파일 개수 세기[count]
    display: |-
      # 파일 개수 세기[count]
      ls -1 *.txt | wc -l
      # 결과: 3
    typing: ls -1 *.txt | wc -l
  - id: language-bash-shell-p02-part-5
    title: 표준 출력 + 표준 에러 분리[stdout / stderr]
    display: |-
      # 표준 출력 + 표준 에러 분리[stdout / stderr]
      ls exists.txt 1> out.log 2> err.log
      # 결과: 성공 출력은 out.log, 에러는 err.log
    typing: ls exists.txt 1> out.log 2> err.log
  - id: language-bash-shell-p02-part-6
    title: 성공일 때만 다음 명령 실행[and list]
    display: |-
      # 성공일 때만 다음 명령 실행[and list]
      mkdir -p temp_dir && echo "created"
      # 결과: created
    typing: mkdir -p temp_dir && echo "created"
  - id: language-bash-shell-p02-part-7
    title: 실패했을 때만 다음 명령 실행[or list]
    display: |-
      # 실패했을 때만 다음 명령 실행[or list]
      ls not_found.txt || echo "fallback"
      # 결과: fallback
    typing: ls not_found.txt || echo "fallback"
  - id: language-bash-shell-p02-part-8
    title: xargs 패턴[xargs pattern]
    display: |-
      # xargs 패턴[xargs pattern]
      echo "a.txt b.txt" | xargs touch
      # 결과: a.txt, b.txt 생성
    typing: echo "a.txt b.txt" | xargs touch
  - id: language-bash-shell-p02-part-9
    title: awk 기본 패턴[awk]
    display: |-
      # awk 기본 패턴[awk]
      echo "kim 30" | awk '{print $1}'
      # 결과: kim
    typing: echo "kim 30" | awk '{print $1}'
  - id: language-bash-shell-p02-part-10
    title: sed 기본 치환[sed replace]
    display: |-
      # sed 기본 치환[sed replace]
      echo "hello world" | sed 's/world/shell/'
      # 결과: hello shell
    typing: echo "hello world" | sed 's/world/shell/'
  - id: language-bash-shell-p02-part-11
    title: 백그라운드 실행[background job]
    display: |-
      # 백그라운드 실행[background job]
      sleep 30 &
      jobs
      # 결과: 백그라운드 작업 표시
    typing: |-
      sleep 30 &
      jobs
  - id: language-bash-shell-p02-part-12
    title: 압축[archive]
    display: |-
      # 압축[archive]
      tar -czf logs.tar.gz *.txt
      # 결과: tar.gz 생성
    typing: tar -czf logs.tar.gz *.txt
  - id: language-bash-shell-p02-part-13
    title: 환경 변수 내보내기[export]
    display: |-
      # 환경 변수 내보내기[export]
      export APP_ENV=local
      echo "$APP_ENV"
      # 결과: local
    typing: |-
      export APP_ENV=local
      echo "$APP_ENV"
