              items.Add(name);
              Debug.Log(items.Count);
          }
      }
  - id: language-csharp-unity-p02-part-4
    title: 이벤트[Action]
    display: |-
      // 이벤트[Action]
      using System;
      using UnityEngine;

      public class Health : MonoBehaviour
      {
          public event Action<int> OnHpChanged;

          private int hp = 100;

          public void TakeDamage(int amount)
          {
              hp -= amount;
              OnHpChanged?.Invoke(hp);
          }
      }
    typing: |-
      using System;
      using UnityEngine;

      public class Health : MonoBehaviour
      {
          public event Action<int> OnHpChanged;

          private int hp = 100;

          public void TakeDamage(int amount)
          {
              hp -= amount;
              OnHpChanged?.Invoke(hp);
          }
      }
  - id: language-csharp-unity-p02-part-5
    title: 싱글톤 최소[Instance]
    display: |-
      // 싱글톤 최소[Instance]
      // 남용하지 말고, 게임 매니저 정도에만
      using UnityEngine;

      public class GameManager : MonoBehaviour
      {
          public static GameManager Instance { get; private set; }

          void Awake()
          {
              if (Instance != null)
              {
                  Destroy(gameObject);
                  return;
              }

              Instance = this;
          }
      }
    typing: |-
      using UnityEngine;

      public class GameManager : MonoBehaviour
      {
          public static GameManager Instance { get; private set; }

          void Awake()
          {
              if (Instance != null)
              {
                  Destroy(gameObject);
                  return;
              }

              Instance = this;
          }
      }
  - id: language-csharp-unity-p02-part-6
    title: 레이어 마스크[LayerMask]
    display: |-
      // 레이어 마스크[LayerMask]
      using UnityEngine;

      public class GroundCheck : MonoBehaviour
      {
          [SerializeField] private LayerMask groundMask;
          [SerializeField] private float distance = 1f;

          bool IsGrounded()
          {
              return Physics.Raycast(transform.position, Vector3.down, distance, groundMask);
          }
      }
    typing: |-
      using UnityEngine;

      public class GroundCheck : MonoBehaviour
      {
          [SerializeField] private LayerMask groundMask;
          [SerializeField] private float distance = 1f;

          bool IsGrounded()
          {
              return Physics.Raycast(transform.position, Vector3.down, distance, groundMask);
          }
      }
  - id: language-csharp-unity-p02-part-7
    title: ScriptableObject[데이터]
    display: |-
      // ScriptableObject[데이터]
      // 밸런스·설정을 에셋으로 분리할 때
      using UnityEngine;

      [CreateAssetMenu(menuName = "Game/EnemyData")]
      public class EnemyData : ScriptableObject
      {
          public string enemyName;
          public int maxHp = 50;
          public float moveSpeed = 2f;
      }
    typing: |-
      using UnityEngine;

      [CreateAssetMenu(menuName = "Game/EnemyData")]
