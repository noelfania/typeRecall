      }
  - id: language-csharp-unity-p02-part-8
    title: RequireComponent[의존 강제]
    display: |-
      // RequireComponent[의존 강제]
      using UnityEngine;

      [RequireComponent(typeof(Rigidbody))]
      public class Knockback : MonoBehaviour
      {
          private Rigidbody rb;

          void Awake()
          {
              rb = GetComponent<Rigidbody>();
          }
      }
    typing: |-
      using UnityEngine;

