  - id: language-java-p02-part-12
    title: 스트림[filter / map / collect]
    display: |-
      // 스트림[filter / map / collect]
      import java.util.Arrays;
      import java.util.List;
      import java.util.stream.Collectors;

      List<Integer> numList = Arrays.asList(1, 2, 3, 4);
      List<Integer> resultList = numList.stream()
              .filter(num -> num % 2 == 0)
              .map(num -> num * 10)
              .collect(Collectors.toList());
      System.out.println(resultList);
      // 결과: [20, 40]
    typing: |-
      import java.util.Arrays;
      import java.util.List;
      import java.util.stream.Collectors;

      List<Integer> numList = Arrays.asList(1, 2, 3, 4);
      List<Integer> resultList = numList.stream()
              .filter(num -> num % 2 == 0)
              .map(num -> num * 10)
              .collect(Collectors.toList());
      System.out.println(resultList);
  - id: language-java-p02-part-13
    title: 파일 읽기[BufferedReader]
    display: |-
      // 파일 읽기[BufferedReader]
      import java.io.BufferedReader;
      import java.io.FileReader;
      import java.io.IOException;

      try (BufferedReader reader = new BufferedReader(new FileReader("data.txt"))) {
          String line = reader.readLine();
          System.out.println(line);
      } catch (IOException err) {
          System.out.println("io error");
      }
    typing: |-
