              balance += amount;
          }

          public int getBalance() {
              return balance;
          }
      }

      Account account = new Account();
      account.deposit(100);
      System.out.println(account.getBalance());
  - id: language-java-p02-part-3
    title: 정적·상수[static / final]
    display: |-
      // 정적·상수[static / final]
      class Config {
          static final int MAX_SIZE = 100;

          static int doubleValue(int num) {
              return num * 2;
          }
      }

      System.out.println(Config.MAX_SIZE);
      System.out.println(Config.doubleValue(5));
      // 결과: 100 / 10
    typing: |-
