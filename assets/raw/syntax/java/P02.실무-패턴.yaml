parts:
  - id: language-java-p02-part-1
    title: 클래스와 생성자[class / constructor]
    display: |-
      // 클래스와 생성자[class / constructor]
      class User {
          String name;
          int age;

          User(String name, int age) {
              this.name = name;
              this.age = age;
          }
      }

      User user = new User("kim", 30);
      System.out.println(user.name + "(" + user.age + ")");
      // 결과: kim(30)
    typing: |-
