              super(name);
          }
      }

      Dog dog = new Dog("happy");
      System.out.println(dog.name);
  - id: language-java-p02-part-5
    title: 인터페이스[interface / implements]
    display: |-
      // 인터페이스[interface / implements]
      interface Printer {
          void print(String text);
      }

      class ConsolePrinter implements Printer {
          public void print(String text) {
              System.out.println(text);
          }
      }

      Printer printer = new ConsolePrinter();
      printer.print("hello");
      // 결과: hello
    typing: |-
      interface Printer {
          void print(String text);
      }

      class ConsolePrinter implements Printer {
          public void print(String text) {
              System.out.println(text);
          }
      }

      Printer printer = new ConsolePrinter();
      printer.print("hello");
  - id: language-java-p02-part-6
    title: 재정의[override]
    display: |-
      // 재정의[override]
      class Animal {
          String speak() {
              return "...";
          }
      }

      class Dog extends Animal {
          @Override
          String speak() {
              return "woof";
          }
      }

      System.out.println(new Dog().speak());
      // 결과: woof
    typing: |-
      class Animal {
          String speak() {
              return "...";
          }
      }

      class Dog extends Animal {
          @Override
          String speak() {
              return "woof";
          }
      }

      System.out.println(new Dog().speak());
  - id: language-java-p02-part-7
    title: 추상 클래스[abstract]
    display: |-
      // 추상 클래스[abstract]
      // 구현을 강제하고 싶을 때 짧게 쓴다
      abstract class Shape {
          abstract double area();
      }

      class Square extends Shape {
          double side;

          Square(double side) {
              this.side = side;
          }

          double area() {
              return side * side;
          }
      }

      System.out.println(new Square(3).area());
      // 결과: 9.0
    typing: |-
      abstract class Shape {
          abstract double area();
      }

      class Square extends Shape {
          double side;

          Square(double side) {
              this.side = side;
          }

          double area() {
              return side * side;
          }
      }

      System.out.println(new Square(3).area());
  - id: language-java-p02-part-8
    title: 예외 처리[try / catch / finally]
    display: |-
      // 예외 처리[try / catch / finally]
      try {
          int parsedValue = Integer.parseInt("123");
          System.out.println(parsedValue);
      } catch (NumberFormatException err) {
          System.out.println("parse error");
      } finally {
          System.out.println("done");
      }
      // 결과: 123 / done
    typing: |-
      try {
          int parsedValue = Integer.parseInt("123");
          System.out.println(parsedValue);
      } catch (NumberFormatException err) {
          System.out.println("parse error");
      } finally {
          System.out.println("done");
      }
  - id: language-java-p02-part-9
    title: 예외 던지기[throw / throws]
    display: |-
      // 예외 던지기[throw / throws]
      // Checked: 호출부가 반드시 처리(또는 throws 선언)
      // Unchecked(RuntimeException): 선언 없이도 던질 수 있음
      class AgeGuard {
          static void checkAge(int age) throws Exception {
              if (age < 0) {
                  throw new Exception("invalid age");
              }
          }

          public static void main(String[] args) {
              try {
                  checkAge(-1);
              } catch (Exception err) {
                  System.out.println(err.getMessage());
              }
          }
      }
      // 결과: invalid age
    typing: |-
      class AgeGuard {
          static void checkAge(int age) throws Exception {
              if (age < 0) {
                  throw new Exception("invalid age");
              }
          }

          public static void main(String[] args) {
              try {
                  checkAge(-1);
              } catch (Exception err) {
                  System.out.println(err.getMessage());
              }
          }
      }
  - id: language-java-p02-part-10
    title: 제네릭[List of String]
    display: |-
      // 제네릭[List of String]
      // 타입을 <>로 고정해 캐스팅을 줄인다
      import java.util.ArrayList;
      import java.util.List;

      List<String> nameList = new ArrayList<>();
      nameList.add("kim");
      String firstName = nameList.get(0);
      System.out.println(firstName);
      // 결과: kim
