    title: 임포트와 클래스 골격[import / class]
    display: |-
      import java.util.ArrayList;
      import java.util.HashMap;
      import java.util.List;
      import java.util.Map;

      class P02PracticalPatterns {
          public static void main(String[] args) {
    typing: |-
      import java.util.ArrayList;
      import java.util.HashMap;
      import java.util.List;
      import java.util.Map;

      class P02PracticalPatterns {
          public static void main(String[] args) {
  - id: language-java-p02-part-2
    title: 리스트[list]
    display: |2-
              // 리스트[list]
              List<String> nameList = new ArrayList<>();
              nameList.add("kim");
              nameList.add("lee");
              System.out.println(nameList);
              // 결과: [kim, lee]
    typing: |2-
              List<String> nameList = new ArrayList<>();
              nameList.add("kim");
              nameList.add("lee");
              System.out.println(nameList);
  - id: language-java-p02-part-3
    title: 맵[map]
    display: |2-
              // 맵[map]
              Map<String, Integer> ageMap = new HashMap<>();
              ageMap.put("kim", 30);
              ageMap.put("lee", 25);
              System.out.println(ageMap.get("kim"));
              // 결과: 30
    typing: |2-
              Map<String, Integer> ageMap = new HashMap<>();
              ageMap.put("kim", 30);
              ageMap.put("lee", 25);
              System.out.println(ageMap.get("kim"));
  - id: language-java-p02-part-4
    title: 람다[lambda]
    display: |2-
              // 람다[lambda]
              nameList.forEach(item -> System.out.println(item.toUpperCase()));
              // 결과:
              // KIM
              // LEE
    typing: "        nameList.forEach(item -> System.out.println(item.toUpperCase()));"
  - id: language-java-p02-part-5
    title: 예외 처리[exception handling]
    display: |2-
              // 예외 처리[exception handling]
              try {
                  int parsedValue = Integer.parseInt("123");
                  System.out.println(parsedValue);
              } catch (NumberFormatException err) {
                  System.out.println("parse error");
              }
              // 결과: 123
    typing: |2-
              try {
                  int parsedValue = Integer.parseInt("123");
                  System.out.println(parsedValue);
              } catch (NumberFormatException err) {
                  System.out.println("parse error");
              }
  - id: language-java-p02-part-6
    title: 메서드 분리[method extraction]
    display: |2-
              // 메서드 분리[method extraction]
              System.out.println(formatUser("park", 28));
              // 결과: park(28)
          }

          static String formatUser(String nameValue, int ageValue) {
              return nameValue + "(" + ageValue + ")";
          }
      }
    typing: |2-
              System.out.println(formatUser("park", 28));
          }

          static String formatUser(String nameValue, int ageValue) {
              return nameValue + "(" + ageValue + ")";
          }
      }
