  - id: language-java-p02-part-14
    title: 스레드[Thread / Runnable]
    display: |-
      // 스레드[Thread / Runnable]
      // 작업을 별도 흐름으로 실행하는 개념만
      Runnable task = () -> System.out.println("run");
      Thread worker = new Thread(task);
      worker.start();
      // 결과: run
    typing: |-
      Runnable task = () -> System.out.println("run");
