  - id: language-java-p02-part-11
    title: 람다[forEach]
    display: |-
      // 람다[forEach]
      import java.util.Arrays;
      import java.util.List;

      List<String> nameList = Arrays.asList("kim", "lee");
      nameList.forEach(item -> System.out.println(item.toUpperCase()));
      // 결과: KIM / LEE
