          static int doubleValue(int num) {
              return num * 2;
          }
      }

      System.out.println(Config.MAX_SIZE);
      System.out.println(Config.doubleValue(5));
  - id: language-java-p02-part-4
    title: 상속[extends]
    display: |-
      // 상속[extends]
      class Animal {
          String name;

          Animal(String name) {
              this.name = name;
          }
      }

      class Dog extends Animal {
          Dog(String name) {
              super(name);
          }
      }

      Dog dog = new Dog("happy");
      System.out.println(dog.name);
      // 결과: happy
    typing: |-
