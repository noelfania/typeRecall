id: language-postgresql-p01
category: syntax
kind: code-snippet
language: sql
track:
  id: postgresql
  label: PostgreSQL
title: P01.기본-패턴
source:
  origin: chat-raw PostgreSQL 고빈도 2026-07-18
  note: CREATE·CRUD·RETURNING·WHERE/ILIKE·JOIN. 파티셔닝·고급 윈도우 제외.
parts:
  - id: language-postgresql-p01-part-1
    title: 테이블 생성[create table]
    display: |-
      -- 테이블 생성[create table]
      -- 자주 쓰는 타입만: SERIAL, TEXT, INTEGER, BOOLEAN, TIMESTAMPTZ
      CREATE TABLE users (
          user_id      SERIAL PRIMARY KEY,
          user_name    TEXT NOT NULL,
          user_age     INTEGER,
          is_active    BOOLEAN DEFAULT TRUE,
          created_at   TIMESTAMPTZ DEFAULT NOW()
      );
    typing: |-
      CREATE TABLE users (
          user_id      SERIAL PRIMARY KEY,
          user_name    TEXT NOT NULL,
          user_age     INTEGER,
          is_active    BOOLEAN DEFAULT TRUE,
          created_at   TIMESTAMPTZ DEFAULT NOW()
      );
  - id: language-postgresql-p01-part-2
    title: 삽입과 반환[insert returning]
    display: |-
      -- 삽입과 반환[insert returning]
      INSERT INTO users (user_name, user_age)
      VALUES ('kim', 30)
      RETURNING user_id, user_name; -- 삽입한 행을 다시 조회 없이 바로 받음. 자동 생성 id에 유용
    typing: |-
      INSERT INTO users (user_name, user_age)
      VALUES ('kim', 30)
      RETURNING user_id, user_name;
  - id: language-postgresql-p01-part-3
    title: 조회[select]
    display: |-
      -- 조회[select]
      SELECT user_id, user_name, user_age
      FROM users;
    typing: |-
      SELECT user_id, user_name, user_age
      FROM users;
  - id: language-postgresql-p01-part-4
    title: 수정과 반환[update returning]
    display: |-
      -- 수정과 반환[update returning]
      UPDATE users
      SET user_age = 31
      WHERE user_id = 1
      RETURNING user_id, user_age; -- 수정 후 값을 반환
    typing: |-
      UPDATE users
      SET user_age = 31
      WHERE user_id = 1
      RETURNING user_id, user_age;
  - id: language-postgresql-p01-part-5
    title: 삭제와 반환[delete returning]
    display: |-
      -- 삭제와 반환[delete returning]
      DELETE FROM users
      WHERE user_id = 2
      RETURNING user_id; -- 삭제된 행의 값을 반환
    typing: |-
      DELETE FROM users
      WHERE user_id = 2
      RETURNING user_id;
  - id: language-postgresql-p01-part-6
    title: 조건·대소문자무시[where ilike]
    display: |-
      -- 조건·대소문자무시[where ilike]
      -- ILIKE는 대소문자를 무시하는 LIKE
      SELECT user_name
      FROM users
      WHERE user_name ILIKE 'k%'
        AND user_age >= 20;
    typing: |-
      SELECT user_name
      FROM users
      WHERE user_name ILIKE 'k%'
        AND user_age >= 20;
  - id: language-postgresql-p01-part-7
    title: 정렬·개수제한[order by limit]
    display: |-
      -- 정렬·개수제한[order by limit]
      SELECT user_name, user_age
      FROM users
      ORDER BY user_age DESC
      LIMIT 10; -- ORDER BY 없이 쓰면 어떤 행이 나올지 보장되지 않음
    typing: |-
      SELECT user_name, user_age
      FROM users
      ORDER BY user_age DESC
      LIMIT 10;