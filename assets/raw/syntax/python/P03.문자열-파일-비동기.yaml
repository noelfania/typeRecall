id: language-python-p03
category: syntax
kind: code-snippet
language: python
track:
  id: python
  label: Python
title: P03.문자열-파일-비동기
source:
  origin: 자료 부족·과잉 점검 2026-10-31
  note: 고빈도 핵심 문법 보강.
parts:
  - id: language-python-p03-part-1
    title: 포맷 문자열[f-string]
    display: |-
      # 포맷 문자열[f-string]
      name = "kim"
      age = 30
      print(f"{name} is {age}") # 결과: kim is 30
    typing: |-
      name = "kim"
      age = 30
      print(f"{name} is {age}")
  - id: language-python-p03-part-2
    title: 파일 읽기[with open]
    display: |-
      # 파일 읽기[with open]
      with open("data.txt", encoding="utf-8") as file: # with 블록이 끝나면 파일이 자동으로 닫힘
          text = file.read()
    typing: |-
      with open("data.txt", encoding="utf-8") as file:
          text = file.read()
  - id: language-python-p03-part-3
    title: 인덱스 순회[enumerate]
    display: |-
      # 인덱스 순회[enumerate]
      for index, name in enumerate(["kim", "lee"]): # (순번, 값)을 함께 꺼냄. 순번은 0부터
          print(index, name)
    typing: |-
      for index, name in enumerate(["kim", "lee"]):
          print(index, name)
  - id: language-python-p03-part-4
    title: 묶어 순회[zip]
    display: |-
      # 묶어 순회[zip]
      for name, score in zip(["kim", "lee"], [90, 80]): # 같은 위치끼리 묶음. 짧은 쪽에 맞춰 끝남
          print(name, score)
    typing: |-
      for name, score in zip(["kim", "lee"], [90, 80]):
          print(name, score)
  - id: language-python-p03-part-5
    title: 가변 인자[*args / **kwargs]
    display: |-
      # 가변 인자[*args / **kwargs]
      def log(*args, **kwargs): # *args 위치 인자 튜플, **kwargs 이름 인자 딕셔너리
          print(args, kwargs)

      log(1, 2, level="info") # 결과: (1, 2) {'level': 'info'}
    typing: |-
      def log(*args, **kwargs):
          print(args, kwargs)

      log(1, 2, level="info")
  - id: language-python-p03-part-6
    title: 데이터 클래스[dataclass]
    display: |-
      # 데이터 클래스[dataclass]
      from dataclasses import dataclass

      @dataclass # __init__, __repr__ 등을 자동 생성
      class User:
          name: str
          age: int = 0 # 기본값이 있는 필드는 뒤쪽에 둔다
    typing: |-
      from dataclasses import dataclass

      @dataclass
      class User:
          name: str
          age: int = 0
  - id: language-python-p03-part-7
    title: 비동기 함수[async def]
    display: |-
      # 비동기 함수[async def]
      import asyncio

      async def main():
          await asyncio.sleep(1) # await 기다리는 동안 다른 작업에 양보

      asyncio.run(main()) # 비동기 함수를 시작하는 진입점
    typing: |-
      import asyncio

      async def main():
          await asyncio.sleep(1)

      asyncio.run(main())
  - id: language-python-p03-part-8
    title: 집합[set]
    display: |-
      # 집합[set]
      tags = {"py", "js", "py"} # 중복이 사라짐. 순서 보장 안 됨
      tags.add("go")
      unique = set(["a", "a", "b"]) # 빈 집합은 {}가 아니라 set()
    typing: |-
      tags = {"py", "js", "py"}
      tags.add("go")
      unique = set(["a", "a", "b"])
