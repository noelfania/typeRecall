id: language-python-p01
category: syntax
kind: code-snippet
language: python
track:
  id: python
  label: Python
title: P01.기본-패턴
source:
  origin: chat-raw 실무형 파이썬 2026-07-18
  note: 희귀 문법 제외. 변수·조건·반복·함수·get 등 매일 쓰는 패턴만.
parts:
  - id: language-python-p01-part-1
    title: 기본 타입[int float str bool]
    display: |-
      # 기본 타입[int float str bool]
      user_name = "kim"
      user_age = 30
      score = 4.5
      is_admin = True
      print(user_name, user_age, score, is_admin)
    typing: |-
      user_name = "kim"
      user_age = 30
      score = 4.5
      is_admin = True
      print(user_name, user_age, score, is_admin)
  - id: language-python-p01-part-2
    title: 리스트[list]
    display: |-
      # 리스트[list]
      skills = ["python", "sql"]
      print(skills[0])
      # 결과: python
    typing: |-
      skills = ["python", "sql"]
      print(skills[0])
  - id: language-python-p01-part-3
    title: 딕셔너리[dict = JSON]
    display: |-
      # 딕셔너리[dict = JSON]
      # 실무 데이터는 list + dict 조합이 대부분이다
      user = {
          "name": "kim",
          "age": 30,
          "skills": ["python", "sql"],
      }
      print(user["name"])
    typing: |-
      user = {
          "name": "kim",
          "age": 30,
          "skills": ["python", "sql"],
      }
      print(user["name"])
  - id: language-python-p01-part-4
    title: None - 값 없음[None]
    display: |-
      # None - 값 없음[None]
      email = None
      print(email)
    typing: |-
      email = None
      print(email)
  - id: language-python-p01-part-5
    title: 조건문[if]
    display: |-
      # 조건문[if]
      if user["age"] > 20:
          print("성인")
    typing: |-
      if user["age"] > 20:
          print("성인")
  - id: language-python-p01-part-6
    title: 값 없을 때[if not get]
    display: |-
      # 값 없을 때[if not get] — 실무 핵심
      if not user.get("email"):
          print("이메일 없음")
    typing: |-
      if not user.get("email"):
          print("이메일 없음")
  - id: language-python-p01-part-7
    title: 리스트 순회[for]
    display: |-
      # 리스트 순회[for]
      for skill in user["skills"]:
          print(skill)
    typing: |-
      for skill in user["skills"]:
          print(skill)
  - id: language-python-p01-part-8
    title: 딕셔너리 순회[items]
    display: |-
      # 딕셔너리 순회[items]
      for key, value in user.items():
          print(key, value)
    typing: |-
      for key, value in user.items():
          print(key, value)
  - id: language-python-p01-part-9
    title: 함수[def] - 한 역할
    display: |-
      # 함수[def] - 한 역할
      def get_user_name(user):
          return user["name"]

      print(get_user_name(user))
    typing: |-
      def get_user_name(user):
          return user["name"]

      print(get_user_name(user))
  - id: language-python-p01-part-10
    title: get 안전 접근[get]
    display: |-
      # get 안전 접근[get]
      # user["name"] = 키가 확실할 때
      # user.get("name") = 없을 수도 있을 때
      print(user.get("name"))
      print(user.get("email"))
      # 결과: kim / None
    typing: |-
      print(user.get("name"))
      print(user.get("email"))
