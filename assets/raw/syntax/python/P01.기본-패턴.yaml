id: language-python-p01
category: syntax
kind: code-snippet
language: python
track:
  id: python
  label: Python
title: P01.기본-패턴
source:
  origin: assets/typingSource/Language-Python/P01.기본-패턴.py
parts:
  - id: language-python-p01-part-1
    title: 변수[variable]
    display: |-
      # 변수[variable]
      user_name = "kim"
      user_age = 30
      is_admin = True
      print(user_name, user_age, is_admin)
      # 결과: kim 30 True
    typing: |-
      user_name = "kim"
      user_age = 30
      is_admin = True
      print(user_name, user_age, is_admin)
  - id: language-python-p01-part-2
    title: 리스트[list]
    display: |-
      # 리스트[list]
      score_list = [10, 20, 30]
      print(score_list[0])
      # 결과: 10
    typing: |-
      score_list = [10, 20, 30]
      print(score_list[0])
  - id: language-python-p01-part-3
    title: 딕셔너리[dictionary]
    display: |-
      # 딕셔너리[dictionary]
      user_item = {
          "name": "lee",
          "age": 25,
          "skills": ["python", "sql"],
      }
      print(user_item["name"])
      print(user_item.get("email"))
      # 결과:
      # lee
      # None
    typing: |-
      user_item = {
          "name": "lee",
          "age": 25,
          "skills": ["python", "sql"],
      }
      print(user_item["name"])
      print(user_item.get("email"))
  - id: language-python-p01-part-4
    title: 조건문[condition]
    display: |-
      # 조건문[condition]
      if user_age >= 20:
          print("adult")
      else:
          print("minor")
      # 결과: adult
    typing: |-
      if user_age >= 20:
          print("adult")
      else:
          print("minor")
  - id: language-python-p01-part-5
    title: 반복문[loop]
    display: |-
      # 반복문[loop]
      for skill_item in user_item["skills"]:
          print(skill_item)
      # 결과:
      # python
      # sql
    typing: |-
      for skill_item in user_item["skills"]:
          print(skill_item)
  - id: language-python-p01-part-6
    title: 리스트 컴프리헨션[list comprehension]
    display: |-
      # 리스트 컴프리헨션[list comprehension]
      even_list = [num for num in score_list if num % 2 == 0]
      print(even_list)
      # 결과: [10, 20, 30]
    typing: |-
      even_list = [num for num in score_list if num % 2 == 0]
      print(even_list)
  - id: language-python-p01-part-7
    title: 함수[function]
    display: |-
      # 함수[function]
      def get_display_name(user):
          return f'{user["name"]}({user["age"]})'

      print(get_display_name(user_item))
      # 결과: lee(25)
    typing: |-
      def get_display_name(user):
          return f'{user["name"]}({user["age"]})'

      print(get_display_name(user_item))
  - id: language-python-p01-part-8
    title: 예외 처리[exception handling]
    display: |-
      # 예외 처리[exception handling]
      try:
          parsed_value = int("123")
          print(parsed_value)
      except ValueError:
          print("parse error")
      # 결과: 123
    typing: |-
      try:
          parsed_value = int("123")
          print(parsed_value)
      except ValueError:
          print("parse error")
  - id: language-python-p01-part-9
    title: 파일 / JSON 실무 패턴[file / json pattern]
    display: |-
      # 파일 / JSON 실무 패턴[file / json pattern]
      import json

      json_text = '{"name": "park", "age": 28}'
      parsed_user = json.loads(json_text)
      print(parsed_user["name"])
      # 결과: park
    typing: |-
      import json

      json_text = '{"name": "park", "age": 28}'
      parsed_user = json.loads(json_text)
      print(parsed_user["name"])
