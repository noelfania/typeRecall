id: language-go-p01
category: syntax
kind: code-snippet
language: go
track:
  id: go
  label: Go
title: P01.기본-패턴
source:
  origin: chat-raw Go 필수·고빈도 커리큘럼 2026-07-18
  note: 변수·제어·함수·slice/map. 희귀 문법 제외. 각 파트 단독 타이핑.
parts:
  - id: language-go-p01-part-1
    title: 변수 선언[:= / var]
    display: |-
      // 변수 선언[:= / var]
      // := 는 함수 안에서 타입 추론으로 선언한다
      userName := "kim"
      var userAge int = 30
      fmt.Println(userName, userAge)
      // 결과: kim 30
    typing: |-
      userName := "kim"
      var userAge int = 30
      fmt.Println(userName, userAge)
  - id: language-go-p01-part-2
    title: 기본 타입[int float64 string bool]
    display: |-
      // 기본 타입[int float64 string bool]
      var count int = 3
      var ratio float64 = 1.5
      var label string = "go"
      var ok bool = true
      fmt.Println(count, ratio, label, ok)
      // 결과: 3 1.5 go true
    typing: |-
      var count int = 3
      var ratio float64 = 1.5
      var label string = "go"
      var ok bool = true
      fmt.Println(count, ratio, label, ok)
  - id: language-go-p01-part-3
    title: 상수[const]
    display: |-
      // 상수[const]
      const serviceName = "gmtl"
      const maxRetry = 3
      fmt.Println(serviceName, maxRetry)
      // 결과: gmtl 3
    typing: |-
      const serviceName = "gmtl"
      const maxRetry = 3
      fmt.Println(serviceName, maxRetry)
  - id: language-go-p01-part-4
    title: 이오타[iota]
    display: |-
      // 이오타[iota] — const 블록에서 0부터 자동 증가
      const (
      	StatusReady = iota
      	StatusRunning
      	StatusDone
      )
      fmt.Println(StatusReady, StatusRunning, StatusDone)
      // 결과: 0 1 2
    typing: |-
      const (
      	StatusReady = iota
      	StatusRunning
      	StatusDone
      )
      fmt.Println(StatusReady, StatusRunning, StatusDone)
  - id: language-go-p01-part-5
    title: 조건문[if / else]
    display: |-
      // 조건문[if / else]
      userAge := 30
      if userAge >= 20 {
      	fmt.Println("adult")
      } else {
      	fmt.Println("minor")
      }
      // 결과: adult
    typing: |-
      userAge := 30
      if userAge >= 20 {
      	fmt.Println("adult")
      } else {
      	fmt.Println("minor")
      }
  - id: language-go-p01-part-6
    title: 반복문[for]
    display: |-
      // 반복문[for] — Go에는 while이 없고 for만 쓴다
      count := 0
      for count < 3 {
      	count++
      }
      fmt.Println(count)
      // 결과: 3
    typing: |-
      count := 0
      for count < 3 {
      	count++
      }
      fmt.Println(count)
  - id: language-go-p01-part-7
    title: 범위 순회[for range]
    display: |-
      // 범위 순회[for range]
      scoreList := []int{10, 20, 30}
      for index, score := range scoreList {
      	fmt.Println(index, score)
      }
      // 결과: 0 10 / 1 20 / 2 30
    typing: |-
      scoreList := []int{10, 20, 30}
      for index, score := range scoreList {
      	fmt.Println(index, score)
      }
  - id: language-go-p01-part-8
    title: 분기[switch]
    display: |-
      // 분기[switch]
      role := "admin"
      switch role {
      case "admin":
      	fmt.Println("full")
      case "member":
      	fmt.Println("read")
      default:
      	fmt.Println("none")
      }
      // 결과: full
    typing: |-
      role := "admin"
      switch role {
      case "admin":
      	fmt.Println("full")
      case "member":
      	fmt.Println("read")
      default:
      	fmt.Println("none")
      }
  - id: language-go-p01-part-9
    title: 함수[func]
    display: |-
      // 함수[func] — 매개변수·반환 타입을 이름 뒤에 쓴다
      func add(numA int, numB int) int {
      	return numA + numB
      }

      fmt.Println(add(3, 4))
      // 결과: 7
    typing: |-
      func add(numA int, numB int) int {
      	return numA + numB
      }

      fmt.Println(add(3, 4))
  - id: language-go-p01-part-10
    title: 다중 반환[multiple return]
    display: |-
      // 다중 반환[multiple return]
      func divide(numA int, numB int) (int, bool) {
      	if numB == 0 {
      		return 0, false
      	}
      	return numA / numB, true
      }

      quotient, ok := divide(10, 2)
      fmt.Println(quotient, ok)
      // 결과: 5 true
    typing: |-
      func divide(numA int, numB int) (int, bool) {
      	if numB == 0 {
      		return 0, false
      	}
      	return numA / numB, true
      }

      quotient, ok := divide(10, 2)
      fmt.Println(quotient, ok)
  - id: language-go-p01-part-11
    title: 이름 있는 반환[named return]
    display: |-
      // 이름 있는 반환[named return]
      func sumPair(numA int, numB int) (sum int) {
      	sum = numA + numB
      	return
      }

      fmt.Println(sumPair(2, 3))
      // 결과: 5
    typing: |-
      func sumPair(numA int, numB int) (sum int) {
      	sum = numA + numB
      	return
      }

      fmt.Println(sumPair(2, 3))
  - id: language-go-p01-part-12
    title: 가변 인자[variadic ...]
    display: |-
      // 가변 인자[variadic ...]
      func total(nums ...int) int {
      	sum := 0
      	for _, n := range nums {
      		sum += n
      	}
      	return sum
      }

      fmt.Println(total(1, 2, 3))
      // 결과: 6
    typing: |-
      func total(nums ...int) int {
      	sum := 0
      	for _, n := range nums {
      		sum += n
      	}
      	return sum
      }

      fmt.Println(total(1, 2, 3))
  - id: language-go-p01-part-13
    title: 슬라이스[slice]
    display: |-
      // 슬라이스[slice]
      skills := []string{"go", "sql"}
      fmt.Println(skills[0], len(skills))
      // 결과: go 2
    typing: |-
      skills := []string{"go", "sql"}
      fmt.Println(skills[0], len(skills))
  - id: language-go-p01-part-14
    title: 슬라이스 추가[append]
    display: |-
      // 슬라이스 추가[append]
      valueList := []int{1, 2}
      valueList = append(valueList, 3, 4)
      fmt.Println(valueList)
      // 결과: [1 2 3 4]
    typing: |-
      valueList := []int{1, 2}
      valueList = append(valueList, 3, 4)
      fmt.Println(valueList)
  - id: language-go-p01-part-15
    title: 맵[map]
    display: |-
      // 맵[map]
      userMap := map[string]string{
      	"name": "lee",
      	"role": "admin",
      }
      fmt.Println(userMap["name"])
      // 결과: lee
    typing: |-
      userMap := map[string]string{
      	"name": "lee",
      	"role": "admin",
      }
      fmt.Println(userMap["name"])
  - id: language-go-p01-part-16
    title: 맵 존재 확인[comma ok]
    display: |-
      // 맵 존재 확인[comma ok]
      roleMap := map[string]string{"kim": "admin"}
      roleValue, ok := roleMap["kim"]
      fmt.Println(roleValue, ok)
      // 결과: admin true
    typing: |-
      roleMap := map[string]string{"kim": "admin"}
      roleValue, ok := roleMap["kim"]
      fmt.Println(roleValue, ok)
