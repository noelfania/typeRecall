parts:
  - id: language-javascript-p09-part-1
    title: 생성[creation] - 리터럴[literal] vs 생성자[constructor]
    display: |-
      /* 생성[creation] - 리터럴[literal] vs 생성자[constructor] */
      var reLiteral = /hello/gi;                    // 리터럴[literal] 표기 (컴파일 타임)
      var reConstructor = new RegExp('hello', 'gi'); // 생성자[constructor] (런타임, 동적 패턴)

      reLiteral.test('Hello World')   // true
      reConstructor.test('HELLO')     // true
    typing: |-
      var reLiteral = /hello/gi;
      var reConstructor = new RegExp('hello', 'gi');

      reLiteral.test('Hello World')
      reConstructor.test('HELLO')
  - id: language-javascript-p09-part-2
    title: d  → 인덱스[indices]          - 매치 시작/끝 인덱스 제공
    display: |-
      // d  → 인덱스[indices]          - 매치 시작/끝 인덱스 제공

      'aBcDeF'.match(/[a-z]/g)   // ['a', 'c', 'e']       (g: 전체)
      'aBcDeF'.match(/[a-z]/gi)  // ['a', 'B', 'c', 'D', 'e', 'F'] (i: 대소문자 무시)

      'line1\nline2'.match(/^\w+/m)    // ['line1'] (m 없으면 첫 줄만)
      'line1\nline2'.match(/^\w+/gm)   // ['line1', 'line2'] (m: 각 줄의 ^)

      'hello\nworld'.match(/hello.world/s)  // ['hello\nworld'] (s: . 이 \n 매치)
    typing: |-
      'aBcDeF'.match(/[a-z]/g)
      'aBcDeF'.match(/[a-z]/gi)

      'line1\nline2'.match(/^\w+/m)
      'line1\nline2'.match(/^\w+/gm)

      'hello\nworld'.match(/hello.world/s)
  - id: language-javascript-p09-part-7
    title: 탐욕적[greedy] vs 게으른[lazy] 수량자
    display: |-
      /* 탐욕적[greedy] vs 게으른[lazy] 수량자 */
      '<a><b><c>'.match(/<.+>/)    // ['<a><b><c>'] (greedy: 최대한 매치)
      '<a><b><c>'.match(/<.+?>/)   // ['<a>']       (lazy: 최소한 매치, ? 추가)
      '<a><b><c>'.match(/<.*?>/)   // ['<a>']       (lazy)
    typing: |-
      '<a><b><c>'.match(/<.+>/)
      '<a><b><c>'.match(/<.+?>/)
      '<a><b><c>'.match(/<.*?>/)
  - id: language-javascript-p09-part-10
    title: 역참조[backreference]
    display: |-
      /* 역참조[backreference] */
      'aabbcc'.match(/(.)\1/)   // ['aa', 'a']  (\1 = 첫 번째 캡처 그룹 재참조)
      'abab'.match(/(ab)\1/)    // ['abab', 'ab']
    typing: |-
      'aabbcc'.match(/(.)\1/)
      'abab'.match(/(ab)\1/)
  - id: language-javascript-p09-part-11
    title: 전방탐색[lookahead] / 후방탐색[lookbehind]
    display: |-
      /* 전방탐색[lookahead] / 후방탐색[lookbehind] */
      // (?=x)  긍정 전방탐색[positive lookahead]  - x 앞에 있는 것
      // (?!x)  부정 전방탐색[negative lookahead]  - x 앞에 없는 것
      // (?<=x) 긍정 후방탐색[positive lookbehind] - x 뒤에 있는 것
      // (?<!x) 부정 후방탐색[negative lookbehind] - x 뒤에 없는 것

      '100px 200em 50px'.match(/\d+(?=px)/g)    // ['100', '50']   (px 앞의 숫자만)
      '100px 200em 50px'.match(/\d+(?!px)/g)    // ['200', ...] (px 아닌 것 앞의 숫자)

      '$100 £200 $50'.match(/(?<=\$)\d+/g)      // ['100', '50']   ($ 뒤의 숫자만)
      '$100 £200 $50'.match(/(?<!\$)\d+/g)      // ['200']         ($ 아닌 것 뒤의 숫자)
    typing: |-
      '100px 200em 50px'.match(/\d+(?=px)/g)
      '100px 200em 50px'.match(/\d+(?!px)/g)

      '$100 £200 $50'.match(/(?<=\$)\d+/g)
      '$100 £200 $50'.match(/(?<!\$)\d+/g)
  - id: language-javascript-p09-part-12
    title: 정규식 메서드[regex methods]
    display: |-
      /* 정규식 메서드[regex methods] */
      var re1 = /\d+/g;
      var str1 = 'abc 123 def 456';

      re1.test('abc 123')         // true  (패턴 존재 여부[existence])
      str1.search(/\d+/)          // 4     (첫 번째 매치 인덱스[index], 없으면 -1)
      str1.match(/\d+/g)          // ['123', '456']
      str1.replace(/\d+/g, 'N')   // 'abc N def N'
    typing: |-
      var re1 = /\d+/g;
      var str1 = 'abc 123 def 456';

      re1.test('abc 123')
      str1.search(/\d+/)
      str1.match(/\d+/g)
      str1.replace(/\d+/g, 'N')
  - id: language-javascript-p09-part-13
    title: matchAll - 모든 캡처 그룹 포함 이터레이터[iterator] 반환
    display: |-
      // matchAll - 모든 캡처 그룹 포함 이터레이터[iterator] 반환
      var re2 = /(\d+)/g;
      [...str1.matchAll(re2)].map(m => m[1])  // ['123', '456']

      // split
      'one1two2three'.split(/\d/)  // ['one', 'two', 'three']
    typing: |-
      var re2 = /(\d+)/g;
      [...str1.matchAll(re2)].map(m => m[1])

      'one1two2three'.split(/\d/)
  - id: language-javascript-p09-part-14
    title: replace + 캡처 그룹 참조
    display: |-
      /* replace + 캡처 그룹 참조 */
      // $1 $2... = 캡처 그룹[capture group] 번호 참조
      // $<name>  = 네임드 그룹[named group] 참조
      // $&       = 매치 전체[entire match]
      // $`       = 매치 이전[before match]
      // $'       = 매치 이후[after match]

      '2024-03-18'.replace(/(\d{4})-(\d{2})-(\d{2})/, '$3/$2/$1')  // '18/03/2024'
      '2024-03-18'.replace(/(?<y>\d{4})-(?<m>\d{2})-(?<d>\d{2})/, '$<d>/$<m>/$<y>') // '18/03/2024'

      'hello'.replace(/(\w+)/, '[$&]')  // '[hello]' ($&: 전체 매치)
    typing: |-
      '2024-03-18'.replace(/(\d{4})-(\d{2})-(\d{2})/, '$3/$2/$1')
      '2024-03-18'.replace(/(?<y>\d{4})-(?<m>\d{2})-(?<d>\d{2})/, '$<d>/$<m>/$<y>')

      'hello'.replace(/(\w+)/, '[$&]')
  - id: language-javascript-p09-part-17
    title: 날짜[date] YYYY-MM-DD
    display: |-
      // 날짜[date] YYYY-MM-DD
      var dateRe = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
      dateRe.test('2024-03-18')  // true
      dateRe.test('2024-13-01')  // false
    typing: |-
      var dateRe = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
      dateRe.test('2024-03-18')
      dateRe.test('2024-13-01')
  - id: language-javascript-p09-part-18
    title: URL 프로토콜 추출
    display: |-
      // URL 프로토콜 추출
      'https://example.com'.match(/^(https?):\/\//)
      // ['https://', 'https']
    typing: "'https:"
  - id: language-javascript-p09-part-19
    title: 단어 경계[word boundary]로 정확히 매치
    display: |-
      // 단어 경계[word boundary]로 정확히 매치
      function hasWord(str, word) {
        return new RegExp(`\\b${word}\\b`, 'i').test(str);
      }
      hasWord('Thanks for everything', 'thanks')     // true
      hasWord('Thanksgiving is coming', 'thanks')    // false
    typing: |-
      function hasWord(str, word) {
        return new RegExp(`\\b${word}\\b`, 'i').test(str);
      }
      hasWord('Thanks for everything', 'thanks')
      hasWord('Thanksgiving is coming', 'thanks')
