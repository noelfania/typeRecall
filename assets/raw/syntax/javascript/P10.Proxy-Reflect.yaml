  - id: language-javascript-p10-proxy-reflect-part-1
    title: "handler : 트랩[trap]을 정의하는 객체 (트랩이 없으면 target에 그대로 전달)"
    display: |-
      // handler : 트랩[trap]을 정의하는 객체 (트랩이 없으면 target에 그대로 전달)

      var emptyProxy = new Proxy({ a: 1 }, {});
      emptyProxy.a   // 1  (트랩 없음 → target에 그대로 전달[passthrough])
    typing: |-
      var emptyProxy = new Proxy({ a: 1 }, {});
      emptyProxy.a
