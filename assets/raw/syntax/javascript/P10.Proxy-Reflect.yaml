    title: Reflect.construct - new 호출[constructor call]
    display: |-
      // Reflect.construct - new 호출[constructor call]
      function Point(x, y) { this.x = x; this.y = y; }
      var pt = Reflect.construct(Point, [3, 4]);
      pt.x  // 3
      pt.y  // 4
    typing: |-
