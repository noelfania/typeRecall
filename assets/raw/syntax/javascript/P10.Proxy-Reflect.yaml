parts:
  - id: language-javascript-p10-proxy-reflect-part-2
    title: 기본 트랩[get / set trap]
    display: |-
      // 기본 트랩[get / set trap]
      const user = new Proxy({ age: 30 }, { // 객체 접근을 가로채는 대리 객체
        get(target, prop, receiver) {
          return prop in target ? Reflect.get(target, prop, receiver) : "없음"; // Reflect로 원래 동작을 그대로 수행
        },
        set(target, prop, value, receiver) {
          if (prop === "age" && value <= 0) {
            throw new RangeError("age는 양수");
          }
          return Reflect.set(target, prop, value, receiver); // set 트랩은 성공 여부를 true/false로 반환
        },
      });
    typing: |-
      const user = new Proxy({ age: 30 }, {
        get(target, prop, receiver) {
          return prop in target ? Reflect.get(target, prop, receiver) : "없음";
        },
        set(target, prop, value, receiver) {
          if (prop === "age" && value <= 0) {
            throw new RangeError("age는 양수");
          }
          return Reflect.set(target, prop, value, receiver);
        },
      });
  - id: language-javascript-p10-proxy-reflect-part-14
    title: 활용 패턴 1 - 읽기 전용[read-only] 객체
    display: |-
      /* 활용 패턴 1 - 읽기 전용[read-only] 객체 */
      function readOnly(obj) {
        return new Proxy(obj, {
          set(target, prop) {
            throw new Error(`읽기 전용[read-only]: '${prop}' 수정 불가`);
          },
          deleteProperty(target, prop) {
            throw new Error(`읽기 전용[read-only]: '${prop}' 삭제 불가`);
          }
        });
      }
      var frozenConfig = readOnly({ host: 'localhost', port: 3000 });
      frozenConfig.host        // 'localhost'
      // frozenConfig.host = 'x'; // ❌ Error 발생
    typing: |-
      function readOnly(obj) {
        return new Proxy(obj, {
          set(target, prop) {
            throw new Error(`읽기 전용[read-only]: '${prop}' 수정 불가`);
          },
          deleteProperty(target, prop) {
            throw new Error(`읽기 전용[read-only]: '${prop}' 삭제 불가`);
          }
        });
      }
      var frozenConfig = readOnly({ host: 'localhost', port: 3000 });
      frozenConfig.host
  - id: language-javascript-p10-proxy-reflect-part-16
    title: 활용 패턴 3 - 관찰자[observable] / 반응형[reactive]
    display: |-
      /* 활용 패턴 3 - 관찰자[observable] / 반응형[reactive] */
      function observable(obj, onChange) {
        return new Proxy(obj, {
          set(target, prop, value, receiver) {
            var oldValue = target[prop];
            var result = Reflect.set(target, prop, value, receiver);
            if (oldValue !== value) onChange(prop, oldValue, value);  // 변경 알림[notify change]
            return result;
          }
        });
      }
      var state = observable({ count: 0 }, (prop, oldVal, newVal) => {
        console.log(`${prop}: ${oldVal} → ${newVal}`);
      });
      state.count = 1;   // 'count: 0 → 1'
      state.count = 5;   // 'count: 1 → 5'
    typing: |-
      function observable(obj, onChange) {
        return new Proxy(obj, {
          set(target, prop, value, receiver) {
            var oldValue = target[prop];
            var result = Reflect.set(target, prop, value, receiver);
            if (oldValue !== value) onChange(prop, oldValue, value);
            return result;
          }
        });
      }
      var state = observable({ count: 0 }, (prop, oldVal, newVal) => {
        console.log(`${prop}: ${oldVal} → ${newVal}`);
      });
      state.count = 1;
      state.count = 5;
  - id: language-javascript-p10-proxy-reflect-part-17
    title: Proxy 트랩 안에서 target에 대한 기본 동작을 안전하게 수행할 때 사용
    display: |-
      // Proxy 트랩 안에서 target에 대한 기본 동작을 안전하게 수행할 때 사용

      var refObj = { x: 1 };

      Reflect.get(refObj, 'x')             // 1     (refObj.x 와 동일)
      Reflect.set(refObj, 'y', 2)          // true  (refObj.y = 2 와 동일)
      Reflect.has(refObj, 'x')             // true  ('x' in refObj 와 동일)
      Reflect.deleteProperty(refObj, 'x')  // true  (delete refObj.x 와 동일)
      Reflect.ownKeys(refObj)              // ['y']
    typing: |-
      var refObj = { x: 1 };

      Reflect.get(refObj, 'x')
      Reflect.set(refObj, 'y', 2)
      Reflect.has(refObj, 'x')
      Reflect.deleteProperty(refObj, 'x')
      Reflect.ownKeys(refObj)