id: language-javascript-p01
category: syntax
kind: code-snippet
language: javascript
track:
  id: javascript
  label: JavaScript
title: P01.변수-구조분해
source:
  origin: assets/typingSource/Language-JavaScript/P01.변수-구조분해.js
parts:
  - id: language-javascript-p01-part-1
    title: 변수 스코프[variable scope]
    display: |-
      /* 변수 스코프[variable scope] */
      var varA = 'function-scoped';      // 함수 스코프[function scope], undefined 호이스팅[hoisting]
      let letA = 'block-scoped';         // 블록 스코프[block scope], TDZ (선언 전 접근 → ReferenceError)
      // const constA = 'read-only';     // 재할당 불가[immutable binding] (속성은 변경 가능)

      var userObj = { name: 'kim' };
      userObj.name = 'lee';   // ✅ 속성 변경[property mutation] 가능
      // userObj = {};        // ❌ 재할당[reassignment] 불가 (const일 경우)
    typing: |-
      var varA = 'function-scoped';
      let letA = 'block-scoped';

      var userObj = { name: 'kim' };
      userObj.name = 'lee';
  - id: language-javascript-p01-part-2
    title: 지수[exponentiation] / 논리 할당 연산자[logical assignment operator]
    display: |-
      /* 지수[exponentiation] / 논리 할당 연산자[logical assignment operator] */
      2 ** 10          // 1024
      2 ** 3 ** 2      // 512 (우→좌: 3**2=9, 2**9=512)

      var laA = 1;
      laA &&= 99;      // truthy → 재할당[assignment]: 99

      var laB = 0;
      laB ||= 99;      // falsy → 재할당[assignment]: 99

      var laC = null;
      laC ??= 99;      // null|undefined → 재할당[assignment]: 99
    typing: |-
      2 ** 10
      2 ** 3 ** 2

      var laA = 1;
      laA &&= 99;

      var laB = 0;
      laB ||= 99;

      var laC = null;
      laC ??= 99;
  - id: language-javascript-p01-part-3
    title: Nullish 병합[nullish coalescing] (??)
    display: |-
      /* Nullish 병합[nullish coalescing] (??) */
      null      ?? 'default'   // 'default'
      undefined ?? 'default'   // 'default'
      0         ?? 'default'   // 0   (falsy지만 null이 아님)
      ''        ?? 'default'   // ''  (falsy지만 null이 아님)
    typing: |-
      null      ?? 'default'
      undefined ?? 'default'
      0         ?? 'default'
      ''        ?? 'default'
  - id: language-javascript-p01-part-4
    title: 옵셔널 체이닝[optional chaining] (?.)
    display: |-
      /* 옵셔널 체이닝[optional chaining] (?.) */
      var safeObj = { inner: { val: 42 } };
      safeObj?.inner?.val       // 42
      safeObj?.missing?.val     // undefined (단락 평가[short-circuit evaluation], 에러 없음)
      safeObj?.method?.()       // undefined (메서드 부재 시 안전 호출)
    typing: |-
      var safeObj = { inner: { val: 42 } };
      safeObj?.inner?.val
      safeObj?.missing?.val
      safeObj?.method?.()
  - id: language-javascript-p01-part-5
    title: 스프레드 연산자[spread operator]
    display: |-
      /* 스프레드 연산자[spread operator] */
      var mergedObj = { x: 1, ...{ y: 2, z: 3 } };   // { x: 1, y: 2, z: 3 }
      var mergedArr = [1, ...[2, 3]];                 // [1, 2, 3]
    typing: |-
      var mergedObj = { x: 1, ...{ y: 2, z: 3 } };
      var mergedArr = [1, ...[2, 3]];
  - id: language-javascript-p01-part-6
    title: 배열 구조분해[array destructuring]
    display: |-
      /* 배열 구조분해[array destructuring] */
      var [adA, adB] = [10, 20];           // adA=10, adB=20
      var [adC, , adD] = [1, 2, 3];        // adC=1, adD=3 (두 번째 건너뜀)
      var [adE, ...adRest] = [1, 2, 3];    // adE=1, adRest=[2, 3]
    typing: |-
      var [adA, adB] = [10, 20];
      var [adC, , adD] = [1, 2, 3];
      var [adE, ...adRest] = [1, 2, 3];
  - id: language-javascript-p01-part-7
    title: 값 교환[swap]
    display: |-
      // 값 교환[swap]
      var [swapA, swapB] = [100, 200];
      [swapA, swapB] = [swapB, swapA];     // swapA=200, swapB=100
    typing: |-
      var [swapA, swapB] = [100, 200];
      [swapA, swapB] = [swapB, swapA];
  - id: language-javascript-p01-part-8
    title: 객체 구조분해[object destructuring]
    display: |-
      /* 객체 구조분해[object destructuring] */
      var { name: odName, age: odAge = 30 } = { name: 'kim' };
      // odName='kim', odAge=30 (기본값[default value] 적용)

      var { a: odA, b: odB } = { a: 1, b: 2 };
      // odA=1, odB=2 (키→변수 이름 변경[aliasing])

      var { p: odP, ...odRest } = { p: 1, q: 2, r: 3 };
      // odP=1, odRest={ q:2, r:3 } (나머지 수집[rest collection])
    typing: |-
      var { name: odName, age: odAge = 30 } = { name: 'kim' };

      var { a: odA, b: odB } = { a: 1, b: 2 };

      var { p: odP, ...odRest } = { p: 1, q: 2, r: 3 };
  - id: language-javascript-p01-part-9
    title: 중첩 구조분해[nested destructuring]
    display: |-
      /* 중첩 구조분해[nested destructuring] */
      var nestedSrc = { id: 7, addr: { city: 'Seoul', zip: '12345' } };
      var { id: nestedId, addr: { city: nestedCity } } = nestedSrc;
      // nestedId=7, nestedCity='Seoul'
    typing: |-
      var nestedSrc = { id: 7, addr: { city: 'Seoul', zip: '12345' } };
      var { id: nestedId, addr: { city: nestedCity } } = nestedSrc;
  - id: language-javascript-p01-part-10
    title: 파라미터 구조분해[parameter destructuring]
    display: |-
      /* 파라미터 구조분해[parameter destructuring] */
      function showUser({ name, role = 'user' }) {
        return `${name}(${role})`;
      }
      showUser({ name: 'kim' });                // 'kim(user)'
      showUser({ name: 'lee', role: 'admin' }); // 'lee(admin)'
    typing: |-
      function showUser({ name, role = 'user' }) {
        return `${name}(${role})`;
      }
      showUser({ name: 'kim' });
      showUser({ name: 'lee', role: 'admin' });
  - id: language-javascript-p01-part-11
    title: for...of + 구조분해[destructuring]
    display: |-
      /* for...of + 구조분해[destructuring] */
      var teamList = [
        { name: 'kim', score: 90 },
        { name: 'lee', score: 80 },
      ];
      for (var { name: tName, score: tScore } of teamList) {
        console.log(tName, tScore);
      }
      // kim 90
      // lee 80
    typing: |-
      var teamList = [
        { name: 'kim', score: 90 },
        { name: 'lee', score: 80 },
      ];
      for (var { name: tName, score: tScore } of teamList) {
        console.log(tName, tScore);
      }
  - id: language-javascript-p01-part-12
    title: 동적 키 구조분해[computed property destructuring]
    display: |-
      /* 동적 키 구조분해[computed property destructuring] */
      var dynKey = 'color';
      var { [dynKey]: dynVal } = { color: 'blue' };
      // dynVal='blue'
    typing: |-
      var dynKey = 'color';
      var { [dynKey]: dynVal } = { color: 'blue' };
  - id: language-javascript-p01-part-13
    title: 삼항 연산자 중첩[nested ternary operator]
    display: |-
      /* 삼항 연산자 중첩[nested ternary operator] */
      function grade(score) {
        return score >= 90 ? 'A'
             : score >= 80 ? 'B'
             : score >= 70 ? 'C'
             :               'F';
      }
      grade(85)  // 'B'
      grade(65)  // 'F'
    typing: |-
      function grade(score) {
        return score >= 90 ? 'A'
             : score >= 80 ? 'B'
             : score >= 70 ? 'C'
             :               'F';
      }
      grade(85)
      grade(65)
