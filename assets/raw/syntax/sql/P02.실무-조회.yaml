id: language-sql-p02
category: syntax
kind: code-snippet
language: sql
track:
  id: sql
  label: SQL
title: P02.실무-조회
source:
  origin: assets/typingSource/Language-SQL/P02.실무-조회.sql
parts:
  - id: language-sql-p02-part-1
    title: 조건 묶기[condition grouping]
    display: |-
      -- 조건 묶기[condition grouping]
      SELECT user_name
      FROM users
      WHERE user_age >= 20
        AND user_name LIKE 'k%';
      -- 결과: kim
    typing: |-
      SELECT user_name
      FROM users
      WHERE user_age >= 20
        AND user_name LIKE 'k%';
  - id: language-sql-p02-part-2
    title: 범위 조회[between]
    display: |-
      -- 범위 조회[between]
      SELECT user_name
      FROM users
      WHERE user_age BETWEEN 20 AND 30;
      -- 결과: 20~30 사이 사용자
    typing: |-
      SELECT user_name
      FROM users
      WHERE user_age BETWEEN 20 AND 30;
  - id: language-sql-p02-part-3
    title: 포함 조회[in]
    display: |-
      -- 포함 조회[in]
      SELECT user_name
      FROM users
      WHERE user_id IN (1, 3, 5);
      -- 결과: 지정한 id만 조회
    typing: |-
      SELECT user_name
      FROM users
      WHERE user_id IN (1, 3, 5);
  - id: language-sql-p02-part-4
    title: 널 처리[null handling]
    display: |-
      -- 널 처리[null handling]
      SELECT user_name, COALESCE(user_age, 0) AS safe_age
      FROM users;
      -- 결과: null이면 0 대체
    typing: |-
      SELECT user_name, COALESCE(user_age, 0) AS safe_age
      FROM users;
  - id: language-sql-p02-part-5
    title: 왼쪽 조인[left join]
    display: |-
      -- 왼쪽 조인[left join]
      SELECT u.user_name, o.total_price
      FROM users u
      LEFT JOIN orders o
        ON u.user_id = o.user_id;
      -- 결과: 주문 없는 사용자도 포함
    typing: |-
      SELECT u.user_name, o.total_price
      FROM users u
      LEFT JOIN orders o
        ON u.user_id = o.user_id;
  - id: language-sql-p02-part-6
    title: 그룹 조건[having]
    display: |-
      -- 그룹 조건[having]
      SELECT user_id, COUNT(*) AS order_count
      FROM orders
      GROUP BY user_id
      HAVING COUNT(*) >= 1;
      -- 결과: 주문 1개 이상 사용자
    typing: |-
      SELECT user_id, COUNT(*) AS order_count
      FROM orders
      GROUP BY user_id
      HAVING COUNT(*) >= 1;
  - id: language-sql-p02-part-7
    title: 케이스[case]
    display: |-
      -- 케이스[case]
      SELECT user_name,
             CASE
                 WHEN user_age >= 30 THEN 'senior'
                 ELSE 'junior'
             END AS age_group
      FROM users;
      -- 결과: 조건에 따라 문자열 분기
    typing: |-
      SELECT user_name,
             CASE
                 WHEN user_age >= 30 THEN 'senior'
                 ELSE 'junior'
             END AS age_group
      FROM users;
  - id: language-sql-p02-part-8
    title: 커밋[commit]
    display: |-
      -- 커밋[commit]
      -- 트랜잭션 변경을 DB에 확정한다
      COMMIT;
    typing: |-
      COMMIT;
  - id: language-sql-p02-part-9
    title: 롤백[rollback]
    display: |-
      -- 롤백[rollback]
      -- 트랜잭션 변경을 전부 취소한다
      ROLLBACK;
    typing: |-
      ROLLBACK;
