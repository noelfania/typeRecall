id: language-typescript-p01
category: syntax
kind: code-snippet
language: typescript
track:
  id: typescript
  label: TypeScript
title: P01.기본-패턴
source:
  origin: chat-raw 실무형 TypeScript 2026-07-18
  note: 기본 타입·객체·배열·함수·유니온. 희귀 문법 제외. 각 파트는 단독 타이핑 가능.
parts:
  - id: language-typescript-p01-part-1
    title: 기본 타입[string number boolean]
    display: |-
      // 기본 타입[string number boolean]
      let name: string = "kim";
      let age: number | null = null; // | 둘 중 하나. null도 허용
      let isLogin: boolean = false;
      console.log(name, age, isLogin);
    typing: |-
      let name: string = "kim";
      let age: number | null = null;
      let isLogin: boolean = false;
      console.log(name, age, isLogin);
  - id: language-typescript-p01-part-2
    title: 타입 별칭[type User]
    display: |-
      // 타입 별칭[type User]
      type UserId = number;
      type UserRole = "admin" | "member"; // 문자열 리터럴 유니온. 이 값만 허용

      type User = {
        id: UserId;
        name: string;
        role: UserRole;
        email?: string; // ?는 없어도 되는 속성
      };
    typing: |-
      type UserId = number;
      type UserRole = "admin" | "member";

      type User = {
        id: UserId;
        name: string;
        role: UserRole;
        email?: string;
      };
  - id: language-typescript-p01-part-3
    title: 객체 사용[object]
    display: |-
      // 객체 사용[object]
      type User = {
        id: number;
        name: string;
        role: "admin" | "member";
        email?: string;
      };

      const u1: User = { id: 1, name: "A", role: "admin" }; // email은 선택이라 생략 가능
      const u2: User = { id: 2, name: "B", role: "member", email: "b@x.com" };
      console.log(u1.name, u2.email); // u2.email의 타입은 string | undefined
    typing: |-
      type User = {
        id: number;
        name: string;
        role: "admin" | "member";
        email?: string;
      };

      const u1: User = { id: 1, name: "A", role: "admin" };
      const u2: User = { id: 2, name: "B", role: "member", email: "b@x.com" };
      console.log(u1.name, u2.email);
  - id: language-typescript-p01-part-4
    title: 배열[User[]]
    display: |-
      // 배열[User[]]
      type User = { id: number; name: string };

      const users: User[] = [ // T[] 요소가 T인 배열
        { id: 1, name: "kim" },
        { id: 2, name: "lee" },
      ];
      const ids: number[] = [1, 2, 3];
      console.log(users[0].name, ids);
    typing: |-
      type User = { id: number; name: string };

      const users: User[] = [
        { id: 1, name: "kim" },
        { id: 2, name: "lee" },
      ];
      const ids: number[] = [1, 2, 3];
      console.log(users[0].name, ids);
  - id: language-typescript-p01-part-5
    title: 유니온[string | number]
    display: |-
      // 유니온[string | number]
      type IdOrName = number | string;
      const ids: IdOrName[] = [1, "2", 3]; // 숫자와 문자열이 섞인 배열. 사용 전에 타입을 좁혀야 함
      console.log(ids);
    typing: |-
      type IdOrName = number | string;
      const ids: IdOrName[] = [1, "2", 3];
      console.log(ids);
  - id: language-typescript-p01-part-6
    title: 함수 타입[function]
    display: |-
      // 함수 타입[function]
      function add(a: number, b: number): number { // 반환 타입은 매개변수 뒤 콜론
        return a + b;
      }

      function log(msg: string): void { // void 반환값 없음
        console.log(msg);
      }

      console.log(add(2, 3));
      log("ok");
    typing: |-
      function add(a: number, b: number): number {
        return a + b;
      }

      function log(msg: string): void {
        console.log(msg);
      }

      console.log(add(2, 3));
      log("ok");
  - id: language-typescript-p01-part-7
    title: 화살표 함수 타입[arrow]
    display: |-
      // 화살표 함수 타입[arrow]
      const add: (a: number, b: number) => number = (a, b) => a + b; // 앞은 함수 타입, 뒤는 구현. 인자 타입은 추론됨
      console.log(add(2, 3));
    typing: |-
      const add: (a: number, b: number) => number = (a, b) => a + b;
      console.log(add(2, 3));
  - id: language-typescript-p01-part-8
    title: 옵셔널·기본값[optional default]
    display: |-
      // 옵셔널·기본값[optional default]
      type SendOptions = { retry?: number };

      const send = (url: string, opts: SendOptions = {}) => {
        const retry = opts.retry ?? 0; // ??는 null/undefined일 때만 기본값. 0은 유지
        console.log(`send -> ${url} (retry=${retry})`);
      };

      send("/ping");
      send("/ping", { retry: 3 });
    typing: |-
      type SendOptions = { retry?: number };

      const send = (url: string, opts: SendOptions = {}) => {
        const retry = opts.retry ?? 0;
        console.log(`send -> ${url} (retry=${retry})`);
      };

      send("/ping");
      send("/ping", { retry: 3 });
  - id: language-typescript-p01-part-9
    title: readonly 필드[readonly]
    display: |-
      // readonly 필드[readonly]
      type User = {
        readonly id: number; // 다시 대입하면 컴파일 오류
        name: string;
      };

      const user: User = { id: 1, name: "kim" };
      console.log(user.id);
    typing: |-
      type User = {
        readonly id: number;
        name: string;
      };

      const user: User = { id: 1, name: "kim" };
      console.log(user.id);
  - id: language-typescript-p01-part-10
    title: 상태 리터럴[status union]
    display: |-
      // 상태 리터럴[status union] — enum 대신 자주 씀
      type Status = "loading" | "success" | "error";

      function handle(status: Status) {
        if (status === "loading") {
          console.log("wait");
        }
      }

      handle("loading");
    typing: |-
      type Status = "loading" | "success" | "error";

      function handle(status: Status) {
        if (status === "loading") {
          console.log("wait");
        }
      }

      handle("loading");
