id: language-javascript-es6-p01
category: syntax
kind: code-snippet
language: javascript
track:
  id: javascript-es6
  label: JavaScript ES6
title: P01.기본-문법
source:
  origin: chat-raw JavaScript ES6 features 2026-07-20
  note: const/let·화살표·기본/rest/spread·템플릿·객체 단축·구조분해. 고빈도만.
parts:
  - id: language-javascript-es6-p01-part-1
    title: 상수[const]
    display: |-
      // 상수[const] — 재할당[reassignment] 불가, 객체 속성[property]은 변경 가능
      const PI = 3.141593;
      const user = { name: "kim" };
      user.name = "lee";
      console.log(PI > 3.0, user.name);
      // 결과: true lee
    typing: |-
      const PI = 3.141593;
      const user = { name: "kim" };
      user.name = "lee";
      console.log(PI > 3.0, user.name);
  - id: language-javascript-es6-p01-part-2
    title: 블록 스코프[let]
    display: |-
      // 블록 스코프[block scope] — let은 블록 밖 접근 불가
      let total = 0;
      for (let i = 0; i < 3; i++) {
        total += i;
      }
      console.log(total);
      // 결과: 3
    typing: |-
      let total = 0;
      for (let i = 0; i < 3; i++) {
        total += i;
      }
      console.log(total);
  - id: language-javascript-es6-p01-part-3
    title: let 콜백 캡처[closure]
    display: |-
      // let 콜백 캡처[closure] — 반복마다 새 바인딩[binding]
      const callbacks = [];
      for (let i = 0; i <= 2; i++) {
        callbacks[i] = () => i * 2;
      }
      console.log(callbacks[0](), callbacks[1](), callbacks[2]());
      // 결과: 0 2 4
    typing: |-
      const callbacks = [];
      for (let i = 0; i <= 2; i++) {
        callbacks[i] = () => i * 2;
      }
      console.log(callbacks[0](), callbacks[1](), callbacks[2]());
  - id: language-javascript-es6-p01-part-4
    title: 화살표 함수[arrow function]
    display: |-
      // 화살표 함수[arrow function] — 암묵적 반환[implicit return]
      const odds = [1, 2, 3, 4].filter((n) => n % 2 === 1);
      const doubled = odds.map((v) => v * 2);
      console.log(odds, doubled);
      // 결과: [1, 3] [2, 6]
    typing: |-
      const odds = [1, 2, 3, 4].filter((n) => n % 2 === 1);
      const doubled = odds.map((v) => v * 2);
      console.log(odds, doubled);
  - id: language-javascript-es6-p01-part-5
    title: 화살표 this[lexical this]
    display: |-
      // 화살표 this[lexical this] — 바깥 this를 캡처한다
      const counter = {
        count: 0,
        bump() {
          const inc = () => {
            this.count += 1;
          };
          inc();
        },
      };
      counter.bump();
      console.log(counter.count);
      // 결과: 1
    typing: |-
      const counter = {
        count: 0,
        bump() {
          const inc = () => {
            this.count += 1;
          };
          inc();
        },
      };
      counter.bump();
      console.log(counter.count);
  - id: language-javascript-es6-p01-part-6
    title: 기본 매개변수[default parameter]
    display: |-
      // 기본 매개변수[default parameter]
      function greet(name = "guest", msg = "hi") {
        return `${msg}, ${name}`;
      }
      console.log(greet(), greet("kim", "hello"));
      // 결과: hi, guest / hello, kim
    typing: |-
      function greet(name = "guest", msg = "hi") {
        return `${msg}, ${name}`;
      }
      console.log(greet(), greet("kim", "hello"));
  - id: language-javascript-es6-p01-part-7
    title: Rest 매개변수[rest parameter]
    display: |-
      // Rest 매개변수[rest parameter] — 나머지 인자를 배열로 모은다
      function sum(first, ...rest) {
        return rest.reduce((acc, n) => acc + n, first);
      }
      console.log(sum(1, 2, 3, 4));
      // 결과: 10
    typing: |-
      function sum(first, ...rest) {
        return rest.reduce((acc, n) => acc + n, first);
      }
      console.log(sum(1, 2, 3, 4));
  - id: language-javascript-es6-p01-part-8
    title: 스프레드[spread] 배열
    display: |-
      // 스프레드[spread] 배열 — 펼쳐서 복사·병합
      const base = [1, 2];
      const merged = [...base, 3, ...[4, 5]];
      console.log(merged);
      // 결과: [1, 2, 3, 4, 5]
    typing: |-
      const base = [1, 2];
      const merged = [...base, 3, ...[4, 5]];
      console.log(merged);
  - id: language-javascript-es6-p01-part-9
    title: 스프레드[spread] 객체
    display: |-
      // 스프레드[spread] 객체 — 나중 키가 우선[last-wins]
      const a = { x: 1, y: 2 };
      const b = { y: 9, z: 3 };
      const merged = { ...a, ...b };
      console.log(merged);
      // 결과: { x: 1, y: 9, z: 3 }
    typing: |-
      const a = { x: 1, y: 2 };
      const b = { y: 9, z: 3 };
      const merged = { ...a, ...b };
      console.log(merged);
  - id: language-javascript-es6-p01-part-10
    title: 템플릿 리터럴[template literal]
    display: |-
      // 템플릿 리터럴[template literal] — 보간[interpolation] + 멀티라인
      const name = "kim";
      const score = 95;
      const line = `이름: ${name}, 점수: ${score}`;
      console.log(line);
      // 결과: 이름: kim, 점수: 95
    typing: |-
      const name = "kim";
      const score = 95;
      const line = `이름: ${name}, 점수: ${score}`;
      console.log(line);
  - id: language-javascript-es6-p01-part-11
    title: 객체 단축[shorthand] / 메서드
    display: |-
      // 객체 단축[shorthand property] / 메서드 정의[method definition]
      const name = "lee";
      const age = 30;
      const user = {
        name,
        age,
        greet() {
          return `hi ${this.name}`;
        },
      };
      console.log(user.greet(), user.age);
      // 결과: hi lee 30
    typing: |-
      const name = "lee";
      const age = 30;
      const user = {
        name,
        age,
        greet() {
          return `hi ${this.name}`;
        },
      };
      console.log(user.greet(), user.age);
  - id: language-javascript-es6-p01-part-12
    title: 계산된 속성명[computed property]
    display: |-
      // 계산된 속성명[computed property name]
      const key = "item";
      const bag = {
        [key + "1"]: "a",
        [key + "2"]: "b",
      };
      console.log(bag.item1, bag.item2);
      // 결과: a b
    typing: |-
      const key = "item";
      const bag = {
        [key + "1"]: "a",
        [key + "2"]: "b",
      };
      console.log(bag.item1, bag.item2);
  - id: language-javascript-es6-p01-part-13
    title: 배열 구조분해[array destructuring]
    display: |-
      // 배열 구조분해[array destructuring]
      const [first, second] = [10, 20];
      const [head, ...tail] = [1, 2, 3];
      console.log(first, second, head, tail);
      // 결과: 10 20 1 [2, 3]
    typing: |-
      const [first, second] = [10, 20];
      const [head, ...tail] = [1, 2, 3];
      console.log(first, second, head, tail);
  - id: language-javascript-es6-p01-part-14
    title: 객체 구조분해[object destructuring]
    display: |-
      // 객체 구조분해[object destructuring] — 별칭[alias]·기본값[default]
      const { name: userName, role = "user" } = { name: "kim" };
      const { a, ...rest } = { a: 1, b: 2, c: 3 };
      console.log(userName, role, a, rest);
      // 결과: kim user 1 { b: 2, c: 3 }
    typing: |-
      const { name: userName, role = "user" } = { name: "kim" };
      const { a, ...rest } = { a: 1, b: 2, c: 3 };
      console.log(userName, role, a, rest);
  - id: language-javascript-es6-p01-part-15
    title: 파라미터 구조분해[parameter destructuring]
    display: |-
      // 파라미터 구조분해[parameter destructuring]
      function showUser({ name, role = "user" }) {
        return `${name}(${role})`;
      }
      console.log(showUser({ name: "kim" }));
      // 결과: kim(user)
    typing: |-
      function showUser({ name, role = "user" }) {
        return `${name}(${role})`;
      }
      console.log(showUser({ name: "kim" }));
