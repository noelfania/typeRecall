id: language-css-p01
category: syntax
kind: code-snippet
language: css
track:
  id: css
  label: CSS
title: P01.핵심-패턴
source:
  origin: assets/typingSource/Language-CSS/P01.핵심-패턴.html
  note: HTML 문서 통짜 예문을 개념 단위 스니펫으로 재구성 (2026-07-09)
parts:
  - id: language-css-p01-part-1
    title: 박스 크기 기준[box-sizing] 통일
    display: |-
      /* 박스 크기 기준[box-sizing] 통일 — 패딩·보더 포함 계산 */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    typing: |-
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
  - id: language-css-p01-part-2
    title: 전역 변수[custom property] 정의
    display: |-
      /* 전역 변수[custom property] 정의 */
      :root {
        --bg-color: #f5f7fb;
        --accent-color: #2563eb;
        --gap-size: 16px;
      }
    typing: |-
      :root {
        --bg-color: #f5f7fb;
        --accent-color: #2563eb;
        --gap-size: 16px;
      }
  - id: language-css-p01-part-3
    title: 전역 변수 사용[var()]
    display: |-
      /* 전역 변수 사용[var()] — 두 번째 인자는 기본값 */
      body {
        background: var(--bg-color);
        color: var(--text-color, #1f2937);
      }
    typing: |-
      body {
        background: var(--bg-color);
        color: var(--text-color, #1f2937);
      }
  - id: language-css-p01-part-4
    title: 화면 중앙 배치[place-items]
    display: |-
      /* 화면 중앙 배치[place-items] — grid 한 줄 중앙 정렬 */
      .page-wrapper {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
    typing: |-
      .page-wrapper {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
  - id: language-css-p01-part-5
    title: 카드 그리드[card grid]
    display: |-
      /* 카드 그리드[card grid] — min()으로 최대폭 제한 */
      .card-grid {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--gap-size);
      }
    typing: |-
      .card-grid {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--gap-size);
      }
  - id: language-css-p01-part-6
    title: 카드 스타일[card surface]
    display: |-
      /* 카드 스타일[card surface] — 면·테두리·그림자 */
      .card-item {
        background: #ffffff;
        border: 1px solid #dbe3f0;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }
    typing: |-
      .card-item {
        background: #ffffff;
        border: 1px solid #dbe3f0;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }
  - id: language-css-p01-part-7
    title: 상태 변형[state modifier]
    display: |-
      /* 상태 변형[state modifier] — is-active 클래스로 강조 */
      .card-item.is-active {
        border-color: var(--accent-color);
        transform: translateY(-4px);
      }
    typing: |-
      .card-item.is-active {
        border-color: var(--accent-color);
        transform: translateY(-4px);
      }
  - id: language-css-p01-part-8
    title: 버튼 상태[hover / disabled]
    display: |-
      /* 버튼 상태[hover / disabled] */
      .primary-button:hover {
        opacity: 0.9;
      }

      .primary-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    typing: |-
      .primary-button:hover {
        opacity: 0.9;
      }

      .primary-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
  - id: language-css-p01-part-9
    title: 의사 요소[pseudo element]
    display: |-
      /* 의사 요소[pseudo element] — 콘텐츠 앞에 장식 삽입 */
      .badge-text::before {
        content: "#";
        margin-right: 4px;
        color: var(--accent-color);
      }
    typing: |-
      .badge-text::before {
        content: "#";
        margin-right: 4px;
        color: var(--accent-color);
      }
  - id: language-css-p01-part-10
    title: 반응형[media query]
    display: |-
      /* 반응형[media query] — 모바일에서 1열로 */
      @media (max-width: 768px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
      }
    typing: |-
      @media (max-width: 768px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
      }
  - id: language-css-p01-part-11
    title: 카드 마크업[card markup]
    display: |-
      /* 카드 마크업[card markup] — 위 스타일이 걸리는 구조 */
      <article class="card-item is-active">
        <h1 class="title-text">카드 1</h1>
        <p class="badge-text">active</p>
        <button class="primary-button">확인</button>
        <button class="primary-button" disabled>대기</button>
      </article>
    typing: |-
      <article class="card-item is-active">
        <h1 class="title-text">카드 1</h1>
        <p class="badge-text">active</p>
        <button class="primary-button">확인</button>
        <button class="primary-button" disabled>대기</button>
      </article>
