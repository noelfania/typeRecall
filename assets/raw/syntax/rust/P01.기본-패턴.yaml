  - id: language-rust-p01-part-2
    title: 변수와 가변성[mutability]
    display: |2-
          // 변수와 가변성[mutability]
          let user_name = "kim";
          let mut count_value = 1;
          count_value += 1;
          println!("{} {}", user_name, count_value);
          // 결과: kim 2
    typing: |2-
          let user_name = "kim";
          let mut count_value = 1;
          count_value += 1;
          println!("{} {}", user_name, count_value);
  - id: language-rust-p01-part-3
    title: 기본 타입[primitive type]
    display: |2-
          // 기본 타입[primitive type]
          let score_value: i32 = 95;
          let ratio_value: f64 = 3.14;
          let is_admin: bool = true;
          println!("{} {} {}", score_value, ratio_value, is_admin);
          // 결과: 95 3.14 true
    typing: |2-
          let score_value: i32 = 95;
          let ratio_value: f64 = 3.14;
          let is_admin: bool = true;
          println!("{} {} {}", score_value, ratio_value, is_admin);
  - id: language-rust-p01-part-4
    title: 조건문[condition]
    display: |2-
          // 조건문[condition]
          if score_value >= 90 {
              println!("A");
          } else {
              println!("B");
          }
          // 결과: A
    typing: |2-
          if score_value >= 90 {
              println!("A");
          } else {
              println!("B");
          }
  - id: language-rust-p01-part-5
    title: 반복문[loop]
    display: |2-
          // 반복문[loop]
          let color_list = ["red", "green", "blue"];
          for color_item in color_list {
              println!("{}", color_item);
          }
          // 결과: red / green / blue
    typing: |2-
          let color_list = ["red", "green", "blue"];
          for color_item in color_list {
              println!("{}", color_item);
          }
  - id: language-rust-p01-part-6
    title: 벡터[vector]
    display: |2-
          // 벡터[vector]
          let mut number_list = vec![1, 2, 3];
          number_list.push(4);
          println!("{:?}", number_list);
          // 결과: [1, 2, 3, 4]
    typing: |2-
          let mut number_list = vec![1, 2, 3];
          number_list.push(4);
          println!("{:?}", number_list);
  - id: language-rust-p01-part-7
    title: 구조체[struct]
    display: |2-
          // 구조체[struct]
          let user_item = User {
              name: String::from("lee"),
              age: 28,
          };
          println!("{:?}", user_item);
          println!("{} {}", user_item.name, user_item.age);
          // 결과: lee 28
    typing: |2-
          let user_item = User {
              name: String::from("lee"),
              age: 28,
          };
          println!("{:?}", user_item);
          println!("{} {}", user_item.name, user_item.age);
  - id: language-rust-p01-part-8
    title: 옵션[option]
    display: |2-
          // 옵션[option]
          let maybe_value = Some(10);
          match maybe_value {
              Some(value) => println!("{}", value),
              None => println!("none"),
          }
          // 결과: 10
    typing: |2-
          let maybe_value = Some(10);
          match maybe_value {
              Some(value) => println!("{}", value),
              None => println!("none"),
          }
  - id: language-rust-p01-part-9
    title: 함수[function]
    display: |2-
          // 함수[function]
          let sum_value = add(3, 4);
          println!("{}", sum_value);
