    title: 구조체 정의[struct / derive]
    display: |-
      // 구조체 정의[struct / derive] - Debug 파생으로 {:?} 출력 가능
      #[derive(Debug)]
      struct User {
          name: String,
          age: u32,
      }
    typing: |-
      #[derive(Debug)]
      struct User {
          name: String,
          age: u32,
      }
