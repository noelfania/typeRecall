id: language-git-temp
category: syntax
kind: command
language: shell
track:
  id: git
  label: Git
title: P03.커밋-메시지-규칙
source:
  origin: assets/typingSource/Language-git/temp.md / chat-raw Conventional Commits 2026-07-18
  note: Conventional Commits 규칙. subject는 소문자·영문·70자 이내. type 연습은 짧게, 동사 변주는 P02와 중복을 피한다.
parts:
  - id: language-git-temp-part-1
    title: 기본 구조[conventional commits]
    display: |-
      # 기본 구조[conventional commits]
      # <type>(<scope>): <subject>
      #
      # <body>
      #
      # <footer>
      git commit -m "feat(auth): add oauth login"
    typing: |-
      git commit -m "feat(auth): add oauth login"
  - id: language-git-temp-part-2
    title: feat - 새 기능[feat]
    display: |-
      # feat - 새 기능[feat]
      git commit -m "feat(player): add progress bar to music player"
    typing: |-
      git commit -m "feat(player): add progress bar to music player"
  - id: language-git-temp-part-3
    title: fix - 버그 수정[fix]
    display: |-
      # fix - 버그 수정[fix]
      git commit -m "fix(api): handle 404 error gracefully"
    typing: |-
      git commit -m "fix(api): handle 404 error gracefully"
  - id: language-git-temp-part-4
    title: docs - 문서[docs]
    display: |-
      # docs - 문서[docs]
      git commit -m "docs(readme): add setup guide for devs"
    typing: |-
      git commit -m "docs(readme): add setup guide for devs"
  - id: language-git-temp-part-5
    title: style - 포맷만[style]
    display: |-
      # style - 포맷만[style] — 동작 변화 없음
      git commit -m "style: apply prettier formatting"
    typing: |-
      git commit -m "style: apply prettier formatting"
  - id: language-git-temp-part-6
    title: refactor - 구조 개선[refactor]
    display: |-
      # refactor - 구조 개선[refactor] — 동작 변화 없음
      git commit -m "refactor(auth): extract token logic into utils"
    typing: |-
      git commit -m "refactor(auth): extract token logic into utils"
  - id: language-git-temp-part-7
    title: perf - 성능[perf]
    display: |-
      # perf - 성능[perf]
      git commit -m "perf(db): optimize query speed"
    typing: |-
      git commit -m "perf(db): optimize query speed"
  - id: language-git-temp-part-8
    title: test - 테스트[test]
    display: |-
      # test - 테스트[test]
      git commit -m "test: add unit tests for utils"
    typing: |-
      git commit -m "test: add unit tests for utils"
  - id: language-git-temp-part-9
    title: chore - 잡무[chore]
    display: |-
      # chore - 잡무[chore] — 빌드·설정·의존성
      git commit -m "chore(deps): bump react to v18.2.0"
    typing: |-
      git commit -m "chore(deps): bump react to v18.2.0"
  - id: language-git-temp-part-10
    title: build - 빌드[build]
    display: |-
      # build - 빌드[build]
      git commit -m "build: update vite build script"
    typing: |-
      git commit -m "build: update vite build script"
  - id: language-git-temp-part-11
    title: ci - CI/CD[ci]
    display: |-
      # ci - CI/CD[ci]
      git commit -m "ci: add build cache to github actions"
    typing: |-
      git commit -m "ci: add build cache to github actions"
  - id: language-git-temp-part-12
    title: revert - 되돌림[revert]
    display: |-
      # revert - 되돌림[revert]
      git commit -m "revert: revert \"feat: dark mode support\""
    typing: |-
      git commit -m "revert: revert \"feat: dark mode support\""
  - id: language-git-temp-part-13
    title: body로 이유 적기[commit body]
    display: |-
      # body로 이유 적기[commit body]
      # subject는 무엇을, body는 왜를 적는다
      git commit -m "$(cat <<'EOF'
      fix(api): handle null user response

      Upstream sometimes returns null user; guard before access.
      EOF
      )"
    typing: |-
      git commit -m "$(cat <<'EOF'
      fix(api): handle null user response

      Upstream sometimes returns null user; guard before access.
      EOF
      )"
  - id: language-git-temp-part-14
    title: footer로 이슈 연결[closes]
    display: |-
      # footer로 이슈 연결[closes]
      git commit -m "$(cat <<'EOF'
      feat(auth): add oauth login

      Closes #123
      EOF
      )"
    typing: |-
      git commit -m "$(cat <<'EOF'
      feat(auth): add oauth login

      Closes #123
      EOF
      )"
  - id: language-git-temp-part-15
    title: 커밋 템플릿 설정[commit.template]
    display: |-
      # 커밋 템플릿 설정[commit.template]
      # .gitmessage.txt를 기본 메시지로 쓴다
      git config --global commit.template ~/.gitmessage.txt
    typing: |-
      git config --global commit.template ~/.gitmessage.txt
