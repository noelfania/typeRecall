id: knowledge-terms-camera
category: knowledge
kind: term
topic: camera
title: 촬영 실무 어휘
source:
  origin: chat-raw 2026-07-18 / 사진·영상 촬영 기법 가이드 이미지
  note: 고빈도 구도·카메라 무브만. 체크리스트·팁 요약은 생략.
terms:
  # ── 사진 ──────────────────────────────────────────
  - id: camera-headspace
    section: 사진
    title: 헤드스페이스
    prompt: 피사체가 바라보는 방향에 여백을 두어 시선의 흐름과 여유를 연출하는 구도.
    answer: Headspace
    example: 인물이 오른쪽을 보면 오른쪽에 헤드스페이스[Headspace]를 남긴다.
  - id: camera-rule-of-thirds
    section: 사진
    title: 룰 오브 써드
    prompt: 화면을 3×3으로 나누어 주요 피사체나 수평선을 교차점·선 위에 배치하는 구도.
    answer: Rule of Thirds
    example: 수평선은 룰 오브 써드[Rule of Thirds] 위쪽 선에 맞춘다.
  - id: camera-leading-lines
    section: 사진
    title: 리딩 라인
    prompt: 선이나 형태를 이용해 시선을 자연스럽게 피사체로 유도하는 기법.
    answer: Leading Lines
    example: 도로의 리딩 라인[Leading Lines]으로 시선을 건물로 이끈다.
  - id: camera-symmetry
    section: 사진
    title: 대칭 구도
    prompt: 좌우 대칭을 활용해 안정감·질서·강한 인상을 연출하는 구도.
    answer: Symmetry
    example: 반사된 호수로 대칭 구도[Symmetry]를 잡았다.
  - id: camera-framing
    section: 사진
    title: 프레이밍
    prompt: 주변 요소를 액자처럼 활용해 피사체를 강조하고 집중도를 높이는 기법.
    answer: Framing
    example: 아치로 피사체를 프레이밍[Framing]했다.
  - id: camera-foreground
    section: 사진
    title: 전경 활용
    prompt: 전경을 포함해 깊이감과 공간감을 표현하는 기법.
    answer: Foreground
    example: 나뭇가지를 전경[Foreground]에 넣어 깊이감을 살렸다.
  - id: camera-shallow-dof
    section: 사진
    title: 얕은 심도
    prompt: 조리개를 열어 배경을 흐리게 하여 피사체를 돋보이게 하는 심도 표현.
    answer: Shallow DOF
    aliases:
      - Shallow Depth of Field
    example: 인물 촬영은 얕은 심도[Shallow DOF]로 배경을 날린다.
  - id: camera-deep-dof
    section: 사진
    title: 깊은 심도
    prompt: 조리개를 조여 전경부터 배경까지 모두 선명하게 표현하는 심도.
    answer: Deep DOF
    aliases:
      - Deep Depth of Field
    example: 풍경은 깊은 심도[Deep DOF]로 전경·배경을 함께 살린다.
  - id: camera-negative-space
    section: 사진
    title: 네거티브 스페이스
    prompt: 여백을 적극 활용해 단순함과 메시지의 여운을 강조하는 구도.
    answer: Negative Space
    example: 하늘 여백으로 네거티브 스페이스[Negative Space]를 크게 잡았다.
  - id: camera-close-up
    section: 사진
    title: 클로즈업
    prompt: 피사체를 가까이 촬영해 디테일·질감·감정을 강조하는 샷.
    answer: Close-up
    example: 손의 질감은 클로즈업[Close-up]으로 보여 준다.
  - id: camera-long-shot
    section: 사진
    title: 롱 샷
    prompt: 넓은 배경을 포함해 피사체와 환경의 관계를 강조하는 샷.
    answer: Long Shot
    example: 도시와 인물의 관계는 롱 샷[Long Shot]으로 잡는다.
  - id: camera-high-angle
    section: 사진
    title: 하이 앵글
    prompt: 피사체를 위에서 내려다보는 구도. 작고 약한 느낌이나 전개를 표현한다.
    answer: High Angle
    example: 하이 앵글[High Angle]로 피사체를 작게 보이게 했다.
  - id: camera-low-angle
    section: 사진
    title: 로우 앵글
    prompt: 피사체를 아래에서 올려다보는 구도. 크고 강한 느낌·위엄을 표현한다.
    answer: Low Angle
    example: 로우 앵글[Low Angle]로 건물의 위엄을 살렸다.
  - id: camera-golden-ratio
    section: 사진
    title: 골든 비율
    prompt: 황금비율(1:1.618)을 활용해 조화롭고 자연스러운 구도를 연출하는 기법.
    answer: Golden Ratio
    example: 주 피사체를 골든 비율[Golden Ratio] 곡선 위에 놓았다.
  - id: camera-pattern
    section: 사진
    title: 패턴
    prompt: 반복되는 형태나 패턴을 활용해 리듬감과 통일감을 강조하는 구도.
    answer: Pattern
    example: 창문의 반복 패턴[Pattern]으로 리듬을 만들었다.
  - id: camera-contrast
    section: 사진
    title: 대비
    prompt: 명암·색상·크기 등의 대비로 강렬한 인상과 주목도를 높이는 기법.
    answer: Contrast
    example: 밝은 피사체와 어두운 배경의 대비[Contrast]를 살렸다.
  - id: camera-silhouette
    section: 사진
    title: 실루엣
    prompt: 역광을 활용해 실루엣으로 촬영해 형태와 분위기를 강조하는 기법.
    answer: Silhouette
    example: 석양 앞 인물을 실루엣[Silhouette]으로 담았다.
  - id: camera-backlight
    section: 사진
    title: 역광
    prompt: 빛을 뒤에서 비춰 피사체에 빛의 윤곽과 분위기를 더하는 조명.
    answer: Backlight
    example: 역광[Backlight]으로 머리카락에 윤곽광을 만들었다.
  - id: camera-motion-blur
    section: 사진
    title: 모션 블러
    prompt: 느린 셔터속도로 움직임을 흐리게 표현해 속도감과 역동성을 연출하는 기법.
    answer: Motion Blur
    example: 달리는 차를 모션 블러[Motion Blur]로 표현했다.
  - id: camera-panorama
    section: 사진
    title: 파노라마
    prompt: 가로로 넓게 촬영해 광활한 풍경과 스케일을 표현하는 기법.
    answer: Panorama
    example: 능선 전체를 파노라마[Panorama]로 이어 찍었다.

  # ── 영상 ──────────────────────────────────────────
  - id: camera-crane-up
    section: 영상
    title: 크레인 업
    prompt: 카메라가 위로 올라가며 넓은 시야를 보여주는 무브. 공간의 확장·웅장함을 준다.
    answer: Crane Up
    example: 엔딩은 크레인 업[Crane Up]으로 공간을 넓힌다.
  - id: camera-crane-down
    section: 영상
    title: 크레인 다운
    prompt: 카메라가 아래로 내려오며 피사체를 점차 부각하는 무브. 긴장·집중을 만든다.
    answer: Crane Down
    example: 크레인 다운[Crane Down]으로 주인공에게 시선을 모은다.
  - id: camera-jib-up
    section: 영상
    title: 지브 업
    prompt: 지브(긴 암)로 카메라를 위로 올리는 무브. 스케일과 입체감을 강조한다.
    answer: Jib Up
    example: 지브 업[Jib Up]으로 세트 전체 스케일을 보여 준다.
  - id: camera-jib-down
    section: 영상
    title: 지브 다운
    prompt: 지브로 카메라를 아래로 내리는 무브. 압박감 있는 상황을 표현한다.
    answer: Jib Down
    example: 지브 다운[Jib Down]으로 압박감을 실었다.
  - id: camera-dolly-in
    section: 영상
    title: 달리 인
    prompt: 카메라가 피사체를 향해 앞으로 다가가는 무브. 몰입·긴장·감정 고조를 만든다.
    answer: Dolly In
    example: 대화 클라이맥스는 달리 인[Dolly In]으로 다가간다.
  - id: camera-dolly-out
    section: 영상
    title: 달리 아웃
    prompt: 카메라가 피사체에서 물러나는 무브. 상황 정리·감정의 거리를 표현한다.
    answer: Dolly Out
    example: 장면 마무리는 달리 아웃[Dolly Out]으로 거리를 둔다.
  - id: camera-dolly-left
    section: 영상
    title: 달리 레프트
    prompt: 카메라가 좌로 이동하는 무브. 시선 이동·관계 변화를 표현한다.
    answer: Dolly Left
    example: 달리 레프트[Dolly Left]로 옆 인물에게 시선을 옮긴다.
  - id: camera-dolly-right
    section: 영상
    title: 달리 라이트
    prompt: 카메라가 우로 이동하는 무브. 시선 이동·관계 변화를 표현한다.
    answer: Dolly Right
    example: 달리 라이트[Dolly Right]로 관계의 전환을 보여 준다.
  - id: camera-zoom-in
    section: 영상
    title: 줌 인
    prompt: 화각을 좁혀 피사체를 키우는 무브. 강조·집중·긴장을 만든다.
    answer: Zoom In
    example: 표정에 줌 인[Zoom In]해 감정을 강조한다.
  - id: camera-zoom-out
    section: 영상
    title: 줌 아웃
    prompt: 화각을 넓혀 피사체를 작게 보이게 하는 무브. 상황 설명·여유·위축감을 준다.
    answer: Zoom Out
    example: 줌 아웃[Zoom Out]으로 주변 상황을 드러낸다.
  - id: camera-crash-zoom-in
    section: 영상
    title: 크래시 줌 인
    prompt: 줌과 전진을 빠르게 동시에 쓰는 무브. 충격·놀람·극적 강조를 만든다.
    answer: Crash Zoom In
    example: 반전 순간은 크래시 줌 인[Crash Zoom In]으로 충격을 준다.
  - id: camera-crash-zoom-out
    section: 영상
    title: 크래시 줌 아웃
    prompt: 줌과 후진을 빠르게 동시에 쓰는 무브. 충격·혼란·극적 전환을 만든다.
    answer: Crash Zoom Out
    example: 크래시 줌 아웃[Crash Zoom Out]으로 장면이 급전환된다.
  - id: camera-tilt-up
    section: 영상
    title: 틸트 업
    prompt: 카메라 각도를 위로 기울이는 무브. 피사체의 키·웅장함을 강조한다.
    answer: Tilt Up
    example: 틸트 업[Tilt Up]으로 건물 높이를 보여 준다.
  - id: camera-tilt-down
    section: 영상
    title: 틸트 다운
    prompt: 카메라 각도를 아래로 기울이는 무브. 상황 파악·압박감을 표현한다.
    answer: Tilt Down
    example: 틸트 다운[Tilt Down]으로 바닥에 놓인 소품을 드러낸다.
  - id: camera-overhead
    section: 영상
    title: 오버헤드
    prompt: 피사체를 바로 위에서 내려다보며 촬영. 전체 상황 파악·관계 드러내기에 쓴다.
    answer: Overhead
    example: 오버헤드[Overhead]로 테이블 위 배치를 한눈에 보여 준다.
  - id: camera-static
    section: 영상
    title: 스태틱
    prompt: 카메라를 고정하고 촬영하는 방식. 안정감과 관찰자 시점의 시선이 된다.
    answer: Static
    aliases:
      - Lock-off
      - Static Lock-off
    example: 대화 신은 스태틱[Static]으로 안정감을 유지한다.
  - id: camera-handheld
    section: 영상
    title: 핸드헬드
    prompt: 손으로 카메라를 들고 촬영. 사실감·긴장·생동감을 만든다.
    answer: Handheld
    example: 추격 신은 핸드헬드[Handheld]로 긴장감을 살린다.
  - id: camera-car-chasing
    section: 영상
    title: 카 체이싱
    prompt: 차량을 이용해 추격 장면을 촬영. 속도·긴박·액션을 강조한다.
    answer: Car Chasing
    example: 고속도로 추격은 카 체이싱[Car Chasing]으로 찍는다.
  - id: camera-lazy-susan
    section: 영상
    title: 레이지 수잔
    prompt: 카메라(또는 피사체)를 수평으로 회전시키는 무브. 관계 변화·긴장·탐색을 표현한다.
    answer: Lazy Susan
    example: 레이지 수잔[Lazy Susan]으로 인물 관계를 천천히 드러낸다.
