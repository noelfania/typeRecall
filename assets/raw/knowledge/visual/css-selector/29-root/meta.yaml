typingUnits:
  - id: unit-caption-1
    kind: caption
    title: "핵심 요약"
    content: ":root에 전역 CSS 변수를 선언합니다."
  - id: unit-code-1
    kind: code-snippet
    language: css
    title: ":root"
    content: |
      :root {
        --color-text: #333;
        --mgn-text: 1.5em;
      }
  - id: unit-code-2
    kind: code-snippet
    language: css
    title: "/*呼び出す時*/"
    content: |
      /*呼び出す時*/
      .text {
        color : var(--color-text);
        margin : var(--mgn-text);
      }
  - id: unit-caption-2
    kind: caption
    title: "보충 설명"
    content: "사용처에서는 var(--변수명)으로 참조합니다."
