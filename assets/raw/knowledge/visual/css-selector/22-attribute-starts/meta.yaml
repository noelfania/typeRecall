  ko: "속성 값이 지정 문자열로 시작하면 선택합니다."

explanation:
  ko: |
    `^=`는 접두사[prefix] 일치입니다.
    
    `p[class^="ttl"]` → class가 ttl로 시작하는 p
    프로토콜·경로 접두 구분에도 씁니다.

