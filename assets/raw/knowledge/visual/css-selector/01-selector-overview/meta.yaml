caption:
  ko: "CSS 규칙은 셀렉터·프로퍼티[property]·값[value] 세 요소로 구성됩니다."

explanation:
  ko: |
    CSS 한 줄은 세 부분으로 나뉩니다.
    
    ① 셀렉터[selector] — 어떤 요소에 적용할지
    ② 프로퍼티[property] — 무엇을 바꿀지
    ③ 값[value] — 어떻게 바꿀지
    
    예: `p { color: #999; }` 에서 `p`가 셀렉터, `color`가 프로퍼티, `#999`가 값입니다.
    이후 섹션은 이 셀렉터 자리의 패턴을 하나씩 연습합니다.

