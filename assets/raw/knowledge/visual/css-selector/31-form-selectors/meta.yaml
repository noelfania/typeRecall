  ko: "입력 필드·체크박스·라디오·제출 버튼 등 폼 요소를 타입별로 지정합니다."

explanation:
  ko: |
    폼 UI는 type과 상태로 세밀하게 고릅니다.
    
    - `input[type="text"]`, `textarea`, `select`
    - `input[type="checkbox"]`, `input[type="radio"]`
    - `:checked` — 체크/선택된 상태
    - `input[type="submit"]` — 전송 버튼
    
    타입 속성 셀렉터와 상태 가상 클래스를 조합하는 것이 핵심입니다.

