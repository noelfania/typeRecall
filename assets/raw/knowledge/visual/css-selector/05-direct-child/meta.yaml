caption:
  ko: "바로 아래 한 단계 자식만 대상입니다. 손자는 제외됩니다."

explanation:
  ko: |
    `>`는 직계 자식만 고릅니다.
    
    `div > p` → div의 바로 아래 p만 (더 깊은 p는 제외)
    자손 공백 셀렉터보다 범위가 좁아 의도치 않은 스타일 확산을 줄입니다.

