explanation:
  ko: |
    `::before` / `::after`는 HTML을 늘리지 않고 앞뒤 콘텐츠를 삽입합니다.
    
    `content`가 있어야 보이며, 아이콘·따옴표·말풍선 삼각형 등에 씁니다.

