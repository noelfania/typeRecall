typingUnits:
  - id: unit-caption-1
    kind: caption
    title: "핵심 요약"
    content: "::before/::after로 요소 앞뒤에 콘텐츠를 삽입합니다."
  - id: unit-code-1
    kind: code-snippet
    language: css
    title: "h2::before"
    content: |
      h2::before {
        content:'前に追加 > ';
      }
  - id: unit-code-2
    kind: code-snippet
    language: css
    title: "h2::after"
    content: |
      h2::after {
        content: ' < 뒤에 추가';
      }
  - id: unit-caption-2
    kind: caption
    title: "보충 설명"
    content: "content 속성과 함께 써야 화면에 나타납니다."
