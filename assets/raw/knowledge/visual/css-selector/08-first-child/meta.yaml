  ko: "부모의 첫 번째 자식인 요소를 선택합니다."

explanation:
  ko: |
    `p:first-child`는 부모의 첫 자식이면서 p일 때만 맞습니다.
    
    앞에 다른 태그가 있으면 첫 자식이 아니므로 선택되지 않습니다.
    태그 종류만 보면 `:first-of-type`이 더 정확할 수 있습니다.

