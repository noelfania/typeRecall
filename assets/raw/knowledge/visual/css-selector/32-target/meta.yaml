typingUnits:
  - id: unit-caption-1
    kind: caption
    title: "핵심 요약"
    content: ":target으로 해시 링크가 가리키는 요소를 선택합니다."
  - id: unit-code-1
    kind: code-snippet
    language: css
    title: "#modal"
    content: |
      #modal {
        display: none;
        /*クリック前のcss*/;
      }
  - id: unit-code-2
    kind: code-snippet
    language: css
    title: "#modal:target"
    content: |
      #modal:target {
        display: block;
        /*クリック後のcss*/;
      }
  - id: unit-caption-2
    kind: caption
    title: "보충 설명"
    content: "모달 표시/숨김을 URL 해시로 제어할 수 있습니다."
