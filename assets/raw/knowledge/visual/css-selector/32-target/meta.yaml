title:
  ko: "페이지 내 링크 — :target"

caption:
  ko: "앵커[anchor]로 이동한 대상 요소에 스타일을 적용합니다."

explanation:
  ko: |
    `#modal:target`은 URL 해시가 `#modal`일 때 그 요소를 선택합니다.
    
    클릭 전 `display: none`, 클릭 후 `:target`에서 `display: block`처럼
    모달·탭을 JS 없이 제어하는 패턴에 쓰입니다.

images:
  - id: css-selector-030
