  ko: "같은 태그 종류 중 첫 번째 요소를 선택합니다."

explanation:
  ko: |
    `p:first-of-type`은 형제 중 첫 번째 p를 고릅니다.
    
    앞에 h2 등이 있어도 p만 보면 첫 번째이면 선택됩니다.
    핀포인트로 특정 태그를 고를 때는 `:first-child`보다 이쪽이 추천됩니다.

