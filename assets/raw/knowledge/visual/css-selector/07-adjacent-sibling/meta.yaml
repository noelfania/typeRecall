explanation:
  ko: |
    그 요소의 바로 뒤 이웃만 셀렉터로 삼습니다.
    
    `h3 + p` → h3 바로 다음 p 하나
    ※ 완전히 인접한 요소가 아니면 동작하지 않습니다. 사이에 다른 태그가 끼면 매칭되지 않습니다.
    `~`보다 범위가 좁아 제목 바로 아래 문단만 꾸밀 때 유용합니다.

