caption:
  ko: "같은 부모 아래, 앞 요소 뒤에 나오는 형제가 대상입니다."

explanation:
  ko: |
    `~`는 지정 요소보다 뒤에 나오는 같은 레벨 형제를 모두 선택합니다.
    
    `h3 ~ p` → 어떤 h3 뒤에 오는 p들
    바로 다음 하나만 필요하면 `+`를 씁니다.

