explanation:
  ko: |
    지정한 요소에 형제 요소가 없을 때만 적용됩니다.
    
    `p:only-child`는 부모 아래 자식이 하나뿐일 때 그 요소가 p이면 선택됩니다.
    형제가 하나라도 생기면 더 이상 매칭되지 않습니다.

