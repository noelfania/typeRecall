  ko: "속성 값이 지정 문자열로 끝나면 선택합니다."

explanation:
  ko: |
    `$=`는 접미사[suffix] 일치입니다.
    
    `p[class$="one"]` → class가 one으로 끝나는 p
    확장자(`.pdf`, `.png`) 링크 스타일에 자주 씁니다.

