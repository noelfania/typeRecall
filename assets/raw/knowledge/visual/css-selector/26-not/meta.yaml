  ko: "조건에 맞지 않는 요소를 선택합니다."

explanation:
  ko: |
    `p:not(.text)`는 class가 .text가 아닌 p를 선택합니다.
    
    `not(조건)`으로 예외를 빼면, 공통 스타일 후 일부만 다르게 주기 쉽습니다.

