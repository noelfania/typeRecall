source:
  archivedHtm: CSS Grid 実務編.htm  # 원본 HTM 삭제됨
  tocId: webliker-toc-14
  sectionTitle:
    ja: "03｜グリッドの端にそれぞれの要素を配置"
    ko: "03｜그리드 끝에 요소 배치"

title:
  ko: "그리드 끝 정렬 — align-self / auto-fill 버튼"

caption:
  ko: "이미지 열은 고정, 텍스트·버튼은 가변. 버튼은 셀 오른쪽 아래·반응형 2열→1열."

explanation:
  ko: |
    `grid-template-columns: 336px 1fr`로 이미지(고정)와 본문(가변)을 나눕니다.
    
    버튼이 셀 전체를 늘어나지 않게 `align-self: flex-start`(또는 하단이면 flex-end)를 씁니다.
    Grid에서도 Flex에서 쓰던 정렬 속성을 쓸 수 있습니다.
    
    버튼 줄에는 `repeat(auto-fill, minmax(250px, 1fr))`를 재사용해
    250px 이하가 되면 2열→1열로 접히게 합니다. `gap`은 아이템 사이에만 여백을 만듭니다
    (figcaption: gap은 아이템 사이에만 여백을 만든다).

