  sectionTitle:
    ja: "04｜タイル風レイアウト"
    ko: "04｜타일 레이아웃"

title:
  ko: "타일 레이아웃 — auto-fit vs auto-fill"

caption:
  ko: "박스를 타일처럼 깔고, 너비에 따라 4→3→2→1열로 자연스럽게 줄어듭니다."

explanation:
  ko: |
    `repeat(auto-fit, minmax(160px, 1fr))`로 타일 열을 만듭니다.
    
    `auto-fill`은 빈 트랙을 남겨 최소폭 열이 여러 개처럼 보이고,
    `auto-fit`은 빈 트랙을 접어 남은 칸을 아이템이 나눠 가집니다.
    타일처럼 “남는 공간을 꽉 채울” 때는 `auto-fit`이 맞는 경우가 많습니다.
    
    중앙 배치는 `place-items: center`(또는 align-items + justify-items)로
    한 줄에 상하좌우 가운데 정렬할 수 있습니다.

