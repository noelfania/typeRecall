title:
  ko: "사이드바 레이아웃 — grid-template-areas"

caption:
  ko: "영역 이름을 붙여 side·main·sns를 배치하고, 그리드 안에서만 따라다니는 SNS를 만듭니다."

explanation:
  ko: |
    `grid-template-areas`로 셀 묶음(영역)에 이름을 붙입니다.
    
    `grid-template-areas: "side main sns";`
    자식에는 `grid-area: side;`처럼 이름만 지정하면 됩니다.
    라인 번호(`grid-row`/`grid-column`)보다 읽기 쉽고,
    미디어 쿼리에서 areas 문자열만 바꿔 재배치하기 좋습니다.
    
    스크롤 시 SNS만 따라가게 할 때도, 그리드 영역 안에서 sticky/고정 패턴을
    조합하는 해설이 HTM에 이어집니다.

