typingUnits:
  - id: unit-caption-1
    kind: caption
    title: "핵심 요약"
    content: "grid-template-areas로 레이아웃 영역에 이름을 붙여 배치합니다."
  - id: unit-code-1
    kind: code-snippet
    language: css
    title: "영역 이름 선언"
    content: |
      .post {
        grid-template-areas: "side main sns";
        grid-template-columns: 240px 1fr 80px;
      }
  - id: unit-code-2
    kind: code-snippet
    language: css
    title: "영역에 아이템 배치"
    content: |
      .post__side {
        grid-area: side;
      }
