  sectionTitle:
    ja: "01｜左右反転のレイアウト"
    ko: "01｜좌우 반전 레이아웃"

title:
  ko: "좌우 반전 — grid-row / grid-column"

caption:
  ko: "짝수 행의 이미지·텍스트 열을 뒤집어 지그재그 레이아웃을 만듭니다."

explanation:
  ko: |
    입문편에서는 `grid-column: 1 / 2`처럼 시작·끝 라인 번호를 모두 적었습니다.
    이웃한 라인에 한 칸만 놓을 때는 끝 번호를 생략할 수 있습니다.
    
    `grid-row: 2; grid-column: 2;` → 행·열 모두 2~3번 라인 사이(한 칸)에 배치.
    figcaption: 「이웃한 라인 번호는 생략할 수 있다」
    
    다만 이 예시는 생략 기법을 보여 주기 위한 것이고, 실제 좌우 반전은
    `flex-direction: row-reverse` / `column-reverse`가 더 적합한 경우가 많습니다.
    열 비가 1:1이 아니거나 행마다 열 폭이 달라지면 Grid 라인 배치가 불리하고,
    자식 폭에 따라 열이 정해지는 레이아웃은 Flex가 유리합니다.

