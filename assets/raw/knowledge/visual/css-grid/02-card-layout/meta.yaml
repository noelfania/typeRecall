title:
  ko: "카드 레이아웃 — repeat(auto-fill, minmax())"

caption:
  ko: "미디어 쿼리 없이 브라우저 너비에 맞춰 카드가 1~3열로 유연하게 배치됩니다."

explanation:
  ko: |
    핵심 한 줄: `grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));`
    
    세 개념이 겹칩니다.
    - `minmax(250px, 1fr)` — 칸은 최소 250px, 최대는 남는 공간을 균등 분배(1fr)
    - `auto-fill` — 컨테이너에 들어갈 수 있는 만큼 칸을 채움. 남는 좁은 폭은 다음 줄로
    - `repeat()` — 위 패턴을 반복
    
    미디어 쿼리로 768px·992px마다 열 수를 지정하는 방식보다 짧지만,
    브레이크포인트별 “정확히 N열” 제어는 어렵다는 트레이드오프가 있습니다.

