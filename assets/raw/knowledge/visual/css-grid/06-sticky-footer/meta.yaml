typingUnits:
  - id: unit-caption-1
    kind: caption
    title: "핵심 요약"
    content: "auto 1fr auto 행 구성으로 짧은 페이지에서도 푸터를 하단에 둡니다."
  - id: unit-code-1
    kind: code-snippet
    language: css
    title: "행 높이 분배"
    content: |
      .l-wrapper {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }
  - id: unit-caption-2
    kind: caption
    title: "auto vs 1fr"
    content: "auto는 콘텐츠만큼, 1fr은 남은 세로 공간을 채웁니다."
