# Grid HTM 06-sticky-footer — HTM 대조 보강

id: css-grid-06-sticky-footer
slug: 06-sticky-footer
category: knowledge
kind: visual
onScreen: false

source:
  archivedHtm: CSS Grid 実務編.htm  # 원본 HTM 삭제됨
  tocId: webliker-toc-24
  sectionTitle:
    ja: "06｜コンテンツが少なくてもページの高さを保持"
    ko: "06｜콘텐츠가 적어도 페이지 높이 유지"

title:
  ko: "스티키 푸터 — auto 1fr auto"

caption:
  ko: "본문이 짧아도 푸터가 화면 아래에 붙도록 행 높이를 분배합니다."

explanation:
  ko: |
    문의 완료 페이지처럼 콘텐츠가 적으면 푸터가 중간에 떠 보기 흉합니다.
    
    `grid-template-rows: auto 1fr auto` + 컨테이너 `min-height: 100vh`로
    헤더·본문·푸터를 나누면, 가운데 `1fr`이 남는 세로 공간을 채웁니다.
    
    - `auto` — 콘텐츠 높이만큼만
    - `1fr` — 남은 공간을 흡수
    
    figcaption: 「콘텐츠가 부족하면 어색한 모습…」→「Grid로 화면 높이를 최소한 유지」

