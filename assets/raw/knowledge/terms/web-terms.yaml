id: rule-dev-terms-readme-terms-web
category: knowledge
kind: term
topic: web
title: 웹 UX·UI 어휘
source:
  origin: assets/typingSource/Rule-dev-terms/README-terms-WEB.md
  note: UI/UX·화면 부품만. 프론트 개발 용어는 terms/frontend-terms.yaml.
terms:
  - id: rule-dev-terms-readme-terms-web-term-2
    section: 페이지 / 섹션 명칭
    title: 히어로 섹션
    prompt: 페이지 최상단에 크게 배치되는 대표 소개 영역.
    answer: Hero Sections
    answerDisplay: 히어로 섹션[Hero Sections]
    example: 첫 화면은 히어로 섹션[Hero Sections]에서 메시지를 강하게 보여줘야 한다.
  - id: rule-dev-terms-readme-terms-web-term-3
    section: 페이지 / 섹션 명칭
    title: 기능 섹션
    prompt: 제품이나 서비스의 핵심 기능[feature]을 나열하는 섹션.
    answer: Feature Sections
    answerDisplay: 기능 섹션[Feature Sections]
    example: 제품의 장점은 기능 섹션[Feature Sections]에서 카드 형태로 정리한다.
  - id: rule-dev-terms-readme-terms-web-term-4
    section: 페이지 / 섹션 명칭
    title: 행동 유도 섹션
    prompt: 사용자에게 가입, 구매, 다운로드 같은 행동[action]을 유도하는 섹션.
    answer: CTA Sections
    answerDisplay: 행동 유도 섹션[CTA Sections]
    example: 가격표 아래에 행동 유도 섹션[CTA Sections]을 한 번 더 넣자.
  - id: rule-dev-terms-readme-terms-web-term-16
    section: 페이지 / 섹션 명칭
    title: 자주 묻는 질문 섹션
    prompt: 자주 묻는 질문과 답변을 모아 둔 섹션.
    answer: FAQs
    answerDisplay: 자주 묻는 질문 섹션[FAQs]
    example: 문의가 많은 서비스라면 자주 묻는 질문 섹션[FAQs]이 꼭 필요하다.
  - id: rule-dev-terms-readme-terms-web-term-17
    section: 페이지 / 섹션 명칭
    title: 푸터
    prompt: 페이지 맨 아래에 회사 정보, 링크, 저작권 등을 넣는 하단 영역.
    answer: Footers
    answerDisplay: 푸터[Footers]
    example: 푸터[Footers]에는 개인정보처리방침 링크를 넣어야 한다.
  - id: rule-dev-terms-readme-terms-web-term-19
    section: 컴포넌트 / UI 명칭
    title: 헤더
    prompt: 상단 네비게이션 컴포넌트 자체를 가리키는 이름.
    answer: Headers
    answerDisplay: 헤더[Headers]
    example: 모바일에서는 헤더[Headers]를 더 단순하게 만드는 편이다.
  - id: rule-dev-terms-readme-terms-web-term-20
    section: 컴포넌트 / UI 명칭
    title: 플라이아웃 메뉴
    prompt: 호버나 클릭 시 옆이나 아래로 펼쳐지는 확장 메뉴.
    answer: Flyout Menus
    answerDisplay: 플라이아웃 메뉴[Flyout Menus]
    example: 카테고리 목록은 플라이아웃 메뉴[Flyout Menus]로 처리할 수 있다.
  - id: rule-dev-terms-readme-terms-web-term-21
    section: 컴포넌트 / UI 명칭
    title: 배너
    prompt: 공지, 할인, 이벤트 같은 메시지를 띠 형태로 보여주는 UI.
    answer: Banners
    answerDisplay: 배너[Banners]
    example: 이벤트 안내는 상단 배너[Banners] 한 줄로 처리하자.
  - id: rule-dev-terms-readme-terms-web-term-23
    section: 전체 페이지 명칭
    title: 404 페이지
    prompt: 페이지를 찾지 못했을 때 보여주는 오류 안내 페이지.
    answer: 404 Pages
    answerDisplay: 404 페이지[404 Pages]
    example: 잘 만든 404 페이지[404 Pages]는 이탈을 줄이는 데 도움이 된다.
  - id: rule-dev-terms-readme-terms-web-term-25
    section: 전체 페이지 명칭
    title: 랜딩 페이지
    prompt: 제품 소개와 전환[conversion] 유도에 집중한 단일 목적 페이지.
    answer: Landing Pages
    answerDisplay: 랜딩 페이지[Landing Pages]
    example: 광고 유입은 보통 전용 랜딩 페이지[Landing Pages]로 받는다.
  - id: web-extra-toast
    section: 오버레이 / 알림
    title: 토스트
    prompt: 화면 상단이나 하단에서 잠깐 나타났다 사라지는 가벼운 알림창. "저장되었습니다" 같은 상태 변화를 알린다.
    answer: Toast
    aliases:
      - Snackbar
    example: 장바구니에 담기면 toast로 짧게 알려주자.
  - id: web-extra-drawer
    section: 오버레이 / 알림
    title: 드로어
    prompt: 화면 옆에서 서랍처럼 밀려 나오는 패널. 모바일 메뉴나 상세 설정에 자주 쓴다.
    answer: Drawer
    example: 모바일에서는 네비게이션을 drawer로 접어 두자.
  - id: web-extra-modal
    section: 오버레이 / 알림
    title: 모달
    prompt: 화면 위에 떠서 사용자의 응답을 요구하는 대화 상자. 닫기 전에는 뒤 화면을 조작할 수 없다.
    answer: Modal Dialog
    aliases:
      - Modal
      - Dialog
    example: 삭제 확인은 modal dialog로 한 번 더 물어보자.
  - id: web-sidebar
    section: 컴포넌트 / UI 명칭
    title: 사이드바
    prompt: 화면 옆쪽에 두는 보조 네비게이션이나 패널 영역.
    answer: Sidebar
    example: 설정 메뉴는 sidebar에 모아 두자.
  - id: web-dashboard
    section: 컴포넌트 / UI 명칭
    title: 대시보드
    prompt: 지표·목록·요약 카드를 한눈에 보는 관리·현황 화면.
    answer: Dashboard
    example: 관리자용 dashboard에 오늘 주문 수를 올렸다.
  - id: web-breadcrumb
    section: 컴포넌트 / UI 명칭
    title: 브레드크럼
    prompt: 현재 위치가 어디인지 경로로 보여주는 탐색 보조 UI. 홈 > 카테고리 > 상품처럼 쓴다.
    answer: Breadcrumb
    aliases:
      - Breadcrumbs
    example: 깊은 카테고리에는 breadcrumb이 필요하다.
  - id: web-tabs
    section: 컴포넌트 / UI 명칭
    title: 탭
    prompt: 같은 영역 안에서 여러 패널을 전환해 보여주는 네비게이션 UI.
    answer: Tabs
    example: 상세/리뷰/문의는 tabs로 나누자.
  - id: web-accordion
    section: 컴포넌트 / UI 명칭
    title: 아코디언
    prompt: 클릭하면 펼쳐지고 접히는 FAQ형 콘텐츠 UI.
    answer: Accordion
    aliases:
      - Disclosure
    example: FAQ는 accordion으로 구현하는 경우가 많다.
  - id: web-carousel
    section: 컴포넌트 / UI 명칭
    title: 캐러셀
    prompt: 이미지·카드를 좌우로 넘겨 보는 슬라이드 UI.
    answer: Carousel
    aliases:
      - Slider
    example: 메인 배너는 carousel로 돌린다.
  - id: web-navigation
    section: 컴포넌트 / UI 명칭
    title: 네비게이션
    prompt: 메뉴 링크 묶음. 헤더·사이드바·탭 등에서 화면 이동을 담당한다.
    answer: Navigation
    aliases:
      - Nav
      - Navbar
    example: 주요 페이지 링크는 header navigation에 둔다.
  - id: web-badge
    section: 컴포넌트 / UI 명칭
    title: 뱃지
    prompt: 상태·개수·라벨을 작게 표시하는 UI. New, 3, Sale 같은 표시에 쓴다.
    answer: Badge
    example: 읽지 않은 알림 개수는 badge로 보여 주자.
  - id: web-card
    section: 컴포넌트 / UI 명칭
    title: 카드
    prompt: 관련 정보를 하나의 블록으로 묶은 UI 단위. 기능·상품·후기 목록에 자주 쓴다.
    answer: Card
    example: Feature 목록은 card 그리드로 배치한다.
  - id: web-design-system
    section: 화면 상태·디자인 체계
    title: 디자인 시스템
    prompt: 재사용 UI 컴포넌트·토큰·사용 규칙을 묶어 제품 전반의 일관성을 유지하는 체계.
    answer: Design System
    answerDisplay: 디자인 시스템[Design System]
    example: 새 화면은 Design System 버튼부터 쓰고 예외만 커스텀한다.
  - id: web-design-token
    section: 화면 상태·디자인 체계
    title: 디자인 토큰
    prompt: 색·간격·타이포·그림자 같은 디자인 값을 이름 있는 변수로 관리하는 단위.
    answer: Design Token
    answerDisplay: 디자인 토큰[Design Token]
    aliases:
      - Design Tokens
    example: primary 색은 hex 대신 Design Token으로 참조한다.
  - id: web-empty-state
    section: 화면 상태·디자인 체계
    title: 빈 상태
    prompt: 데이터가 없을 때 보여주는 안내 UI. 목록이 비었을 때 행동 유도 문구·버튼을 둔다.
    answer: Empty State
    answerDisplay: 빈 상태[Empty State]
    aliases:
      - Empty States
    example: 검색 결과가 없으면 Empty State에 다시 검색 CTA를 넣는다.
  - id: web-loading-state
    section: 화면 상태·디자인 체계
    title: 로딩 상태
    prompt: 데이터를 기다리는 동안의 UI 상태. 스피너·스켈레톤·비활성 버튼으로 표현한다.
    answer: Loading State
    answerDisplay: 로딩 상태[Loading State]
    example: 첫 진입은 Loading State로 스켈레톤을 보여 준다.
  - id: web-error-state
    section: 화면 상태·디자인 체계
    title: 에러 상태
    prompt: 요청 실패·권한 오류 등 실패를 사용자에게 알리고 재시도를 유도하는 UI 상태.
    answer: Error State
    answerDisplay: 에러 상태[Error State]
    example: 500이면 Error State에 재시도 버튼을 둔다.
  - id: web-ui-autocomplete
    section: 입력
    title: 오토컴플리트
    prompt: 입력하며 후보 목록을 좁혀 고르는 검색형 입력 UI.
    answer: Autocomplete
    example: 도시 검색은 autocomplete로 후보를 띄운다.
  - id: web-ui-switch
    section: 입력
    title: 스위치
    prompt: 켜짐/꺼짐 두 상태를 토글하는 스위치형 입력.
    answer: Switch
    aliases:
      - Toggle
    example: 알림 수신 여부는 switch로 바꾼다.
  - id: web-ui-avatar
    section: 데이터 표시
    title: 아바타
    prompt: 사용자나 엔티티를 나타내는 원형·사각 프로필 이미지 UI.
    answer: Avatar
    example: 댓글 작성자는 avatar와 닉네임을 함께 보여 준다.
  - id: web-ui-chip
    section: 데이터 표시
    title: 칩
    prompt: 태그·필터·선택을 작은 알약 형태로 보여 주는 UI.
    answer: Chip
    aliases:
      - Tag
    example: 선택된 필터는 chip으로 표시하고 개별 삭제한다.
  - id: web-ui-divider
    section: 데이터 표시
    title: 디바이더
    prompt: 구역을 가로·세로 선으로 나누는 구분선 UI.
    answer: Divider
    example: 메뉴 항목 그룹 사이에 divider를 넣는다.
  - id: web-ui-tooltip
    section: 데이터 표시
    title: 툴팁
    prompt: 호버·포커스 시 짧게 떠서 부가 설명을 보여 주는 UI.
    answer: Tooltip
    example: 아이콘 버튼에는 tooltip으로 이름을 붙인다.
  - id: web-ui-typography
    section: 데이터 표시
    title: 타이포그래피
    prompt: 제목·본문·캡션 등 텍스트 위계를 맞추는 타이포 컴포넌트·체계.
    answer: Typography
    example: 페이지 제목은 Typography의 h1 스타일로 통일한다.
  - id: web-ui-alert
    section: 피드백
    title: 알림 배너
    prompt: 성공·경고·오류 메시지를 페이지 안에 고정해 보여 주는 피드백 UI.
    answer: Alert
    example: 저장 실패는 alert로 원인을 보여 준다.
  - id: web-ui-progress
    section: 피드백
    title: 진행 표시
    prompt: 작업·로딩 진행률을 막대나 원형으로 보여 주는 UI.
    answer: Progress Bar
    aliases:
      - Progress
      - Circular Progress
    example: 파일 업로드는 progress bar로 진행률을 표시한다.
  - id: web-ui-app-bar
    section: 서피스
    title: 앱 바
    prompt: 화면 상단에 고정되는 앱용 헤더 바. 로고·메뉴·액션을 담는다.
    answer: App Bar
    aliases:
      - AppBar
    example: 대시보드 상단은 app bar에 검색과 프로필을 둔다.
  - id: web-ui-bottom-nav
    section: 네비게이션
    title: 하단 네비게이션
    prompt: 모바일 화면 하단에 주요 탭을 고정하는 네비게이션.
    answer: Bottom Navigation
    example: 홈·검색·마이페이지는 bottom navigation으로 전환한다.
  - id: web-ui-menu
    section: 네비게이션
    title: 메뉴
    prompt: 클릭 시 항목 목록이 펼쳐지는 드롭다운형 선택 UI.
    answer: Menu
    aliases:
      - Dropdown Menu
    example: 계정 설정은 아바타 옆 menu로 연다.
  - id: web-ui-stepper
    section: 네비게이션
    title: 스테퍼
    prompt: 다단계 절차의 현재 단계를 순서대로 보여 주는 네비게이션.
    answer: Stepper
    example: 가입 흐름은 stepper로 1·2·3단계를 표시한다.
  - id: web-ui-popover
    section: 오버레이 / 알림
    title: 팝오버
    prompt: 앵커 요소 옆에 떠서 추가 내용·액션을 보여 주는 오버레이.
    answer: Popover
    example: 필터 상세는 버튼 옆 popover로 연다.
  - id: web-ui-data-grid
    section: 데이터 표시
    title: 데이터 그리드
    prompt: 정렬·필터·페이징이 있는 표 형태의 대용량 데이터 UI.
    answer: Data Grid
    example: 주문 목록 관리는 data grid로 구현한다.
  - id: web-ui-date-picker
    section: 입력
    title: 날짜 선택
    prompt: 달력 UI로 날짜·기간을 고르는 입력 컴포넌트.
    answer: Date Picker
    example: 예약일은 date picker로 고르게 한다.
  - id: web-ui-combobox
    section: 입력
    title: 콤보박스
    prompt: 입력과 목록 선택을 합친 검색 가능 선택 UI. 헤드리스 UI에서 자주 쓴다.
    answer: Combobox
    aliases:
      - Comboboxes
    example: 담당자 지정은 combobox로 검색해 고른다.
  - id: web-ui-primary-button
    section: 실무 패턴
    title: 프라이머리 버튼
    prompt: 화면에서 가장 중요한 행동을 강조하는 기본(강조) 버튼.
    answer: Primary Button
    example: 저장은 primary button, 취소는 텍스트 버튼으로 둔다.