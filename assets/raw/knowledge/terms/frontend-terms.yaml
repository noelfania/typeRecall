id: knowledge-terms-frontend
category: knowledge
kind: term
topic: frontend
title: 프론트엔드 개발 어휘
source:
  origin: web-terms.yaml에서 UX/UI와 분리 (2026-07-24)
  note: 네이밍·상태·성능·Headless UI. UX/UI 부품명은 terms/web-terms.yaml.
terms:
  - id: web-convention
    section: 네이밍 컨벤션
    title: 컨벤션
    prompt: 코드·문서·스타일에서 팀이나 업계가 공통으로 쓰는 이름 규칙과 약속된 표현.
    answer: Convention
    example: 클래스 이름을 마음대로 짓지 말고 팀 convention을 따르자.
  - id: web-semantic-html
    section: 네이밍 컨벤션
    title: 시맨틱 HTML
    prompt: header, nav, main, section, article, footer처럼 의미에 맞는 HTML 태그로 구조를 표현하는 방식.
    answer: Semantic HTML
    aliases:
      - Semantic Tags
    example: div만 쓰지 말고 semantic HTML로 구역을 나눠 보자.
  - id: web-bem
    section: 네이밍 컨벤션
    title: BEM
    prompt: Block__Element--Modifier 형태로 CSS 클래스 이름을 짓는 네이밍 패턴.
    answer: BEM
    aliases:
      - Block Element Modifier
    example: card__title--large처럼 BEM으로 상태를 표현한다.
  - id: web-container
    section: 네이밍 컨벤션
    title: 컨테이너
    prompt: 콘텐츠 폭을 가운데로 제한하는 레이아웃용 래퍼. CSS 클래스명으로도 자주 쓴다.
    answer: Container
    example: 본문은 max-width가 있는 container 안에 넣자.
  - id: web-wrapper
    section: 네이밍 컨벤션
    title: 래퍼
    prompt: 여러 요소를 묶어 배치·스타일을 주기 위한 바깥 감싸개. container와 비슷하게 쓰이지만 더 일반적이다.
    answer: Wrapper
    example: 카드들을 한 덩어리로 묶을 때 wrapper를 둔다.
  - id: web-layout-classes
    section: 네이밍 컨벤션
    title: 레이아웃 클래스
    prompt: row, col, grid, flex, gap처럼 배치·반응형을 나타내는 흔한 클래스·유틸 이름.
    answer: Layout Classes
    aliases:
      - Utility Classes
    example: flex와 gap으로 카드 간격을 맞추는 layout classes를 쓴다.
  - id: web-state-class
    section: 네이밍 컨벤션
    title: 상태 클래스
    prompt: is-active, is-hidden, disabled, error, success처럼 UI 상태를 나타내는 클래스·속성 이름.
    answer: State Class
    aliases:
      - is-active
    example: 열린 탭에 is-active state class를 붙인다.
  - id: web-boolean-naming
    section: 네이밍 컨벤션
    title: 불리언 네이밍
    prompt: isOpen, hasError, canSubmit처럼 true/false 변수에 is·has·can 접두를 쓰는 이름 규칙.
    answer: Boolean Naming
    example: open 대신 isOpen처럼 boolean naming을 쓴다.
  - id: web-handler-naming
    section: 네이밍 컨벤션
    title: 핸들러 네이밍
    prompt: handleClick, onSubmit, fetchData, renderItem처럼 이벤트·데이터·렌더 함수에 쓰는 관례적 이름.
    answer: Handler Naming
    aliases:
      - Event Handler Naming
    example: 클릭 처리는 handleClick으로 handler naming을 맞춘다.
  - id: web-react-file-convention
    section: 네이밍 컨벤션
    title: React 파일 컨벤션
    prompt: components/Button.tsx, hooks/useFetch.ts처럼 폴더·파일·훅 이름(use*)을 역할에 맞게 나누는 규칙.
    answer: React File Convention
    example: 커스텀 훅은 hooks/에 use로 시작하는 React file convention을 따른다.
  - id: web-server-state
    section: 프론트 아키텍처
    title: 서버 상태
    prompt: API에서 가져와 캐시·동기화하는 원격 데이터 상태. 목록·상세·권한 정보가 해당한다.
    answer: Server State
    answerDisplay: 서버 상태[Server State]
    example: 주문 목록은 Server State라서 캐시 무효화로 갱신한다.
  - id: web-client-state
    section: 프론트 아키텍처
    title: 클라이언트 상태
    prompt: 모달 열림·탭 선택·입력 초안처럼 브라우저 UI에만 존재하는 로컬 상태.
    answer: Client State
    answerDisplay: 클라이언트 상태[Client State]
    example: isOpen 같은 모달 플래그는 Client State로 둔다.
  - id: web-container-presentational
    section: 프론트 아키텍처
    title: 컨테이너 프레젠테이셔널 패턴
    prompt: 데이터·로직은 Container, 표시만 Presentational로 나누는 컴포넌트 분리 패턴.
    answer: Container Presentational
    answerDisplay: 컨테이너/프레젠테이셔널[Container Presentational]
    aliases:
      - Container/Presentational
      - Smart Dumb Components
    example: fetch는 Container에, 카드 마크업은 Presentational에 둔다.
  - id: web-code-splitting
    section: 프론트 아키텍처
    title: 코드 분할
    prompt: 번들을 여러 조각으로 나눠 필요한 시점에만 내려받게 하는 최적화 기법.
    answer: Code Splitting
    answerDisplay: 코드 분할[Code Splitting]
    example: 관리자 라우트는 Code Splitting으로 첫 로드에서 뺀다.
  - id: web-lazy-loading
    section: 프론트 아키텍처
    title: 지연 로딩
    prompt: 컴포넌트·이미지·라우트를 당장 쓰지 않을 때 나중에 불러오는 기법.
    answer: Lazy Loading
    answerDisplay: 지연 로딩[Lazy Loading]
    example: 아래쪽 차트는 Lazy Loading으로 뷰포트 진입 시 로드한다.
  - id: web-virtualization
    section: 프론트 아키텍처
    title: 가상화
    prompt: 긴 목록에서 보이는 행만 DOM에 그려 스크롤 성능을 유지하는 기법.
    answer: Virtualization
    answerDisplay: 가상화[Virtualization]
    aliases:
      - Windowing
      - Virtual List
    example: 수천 행 테이블은 Virtualization으로 렌더 비용을 줄인다.
  - id: dev-extra-headless-ui
    section: 프론트 라이브러리
    title: 헤드리스 UI
    prompt: 동작과 접근성 로직만 제공하고 스타일은 사용자가 입히는 UI 라이브러리 방식.
    answer: Headless UI
    example: 디자인 자유도가 필요해서 headless UI 컴포넌트를 골랐다.
  - id: fe-spa
    section: 렌더링
    title: SPA
    prompt: 한 번 받은 앱 셸에서 페이지 전환을 클라이언트 라우팅으로 처리하는 단일 페이지 애플리케이션.
    answer: SPA
    aliases:
      - Single Page Application
    example: 관리자 콘솔은 SPA[SPA]로 화면 전환을 부드럽게 한다.
  - id: fe-ssr
    section: 렌더링
    title: SSR
    prompt: 서버가 HTML을 만들어 내려보내, 첫 화면과 SEO에 유리한 렌더링 방식.
    answer: SSR
    aliases:
      - Server-Side Rendering
    example: 마케팅 랜딩은 SSR[Server-Side Rendering]로 첫 페인트와 검색 노출을 챙긴다.
  - id: fe-csr
    section: 렌더링 / 컴포넌트
    title: 클라이언트 사이드 렌더링
    prompt: 브라우저가 자바스크립트를 실행해 화면을 그리는 방식.
    answer: CSR
    answerDisplay: 클라이언트 사이드 렌더링[CSR]
    example: 관리자 화면은 클라이언트 사이드 렌더링[CSR]으로 충분하다.
  - id: fe-ssg
    section: 렌더링 / 컴포넌트
    title: 정적 사이트 생성
    prompt: 빌드할 때 페이지를 미리 HTML로 만들어 두는 방식.
    answer: SSG
    answerDisplay: 정적 사이트 생성[SSG]
    example: 문서 사이트는 정적 사이트 생성[SSG]으로 배포한다.
  - id: fe-hydration
    section: 렌더링 / 컴포넌트
    title: 하이드레이션
    prompt: 서버가 보낸 HTML에 이벤트와 상태를 연결하는 과정.
    answer: Hydration
    answerDisplay: 하이드레이션[Hydration]
    example: 서버와 값이 달라 하이드레이션[Hydration] 경고가 났다.
  - id: fe-component
    section: 렌더링 / 컴포넌트
    title: 컴포넌트
    prompt: 화면을 이루는 재사용 가능한 UI 단위.
    answer: Component
    answerDisplay: 컴포넌트[Component]
    example: 버튼을 공통 컴포넌트[Component]로 뺐다.
  - id: fe-props
    section: 렌더링 / 컴포넌트
    title: 프롭스
    prompt: 부모 컴포넌트가 자식에게 넘기는 값.
    answer: Props
    answerDisplay: 프롭스[Props]
    example: 프롭스[Props]가 너무 많으면 컴포넌트를 나누자.
  - id: fe-hook
    section: 렌더링 / 컴포넌트
    title: 훅
    prompt: 함수 컴포넌트에서 상태와 생명주기 기능을 쓰게 하는 함수.
    answer: Hook
    answerDisplay: 훅[Hook]
    example: 조회 로직은 커스텀 훅[Hook]으로 뺐다.
  - id: fe-prop-drilling
    section: 렌더링 / 컴포넌트
    title: 프롭 드릴링
    prompt: 값을 쓰지 않는 중간 컴포넌트까지 거쳐 계속 넘기는 일.
    answer: Prop Drilling
    answerDisplay: 프롭 드릴링[Prop Drilling]
    example: 프롭 드릴링[Prop Drilling]이 깊어 컨텍스트로 바꿨다.
  - id: fe-memoization
    section: 렌더링 / 컴포넌트
    title: 메모이제이션
    prompt: 계산 결과를 기억해 같은 입력에 다시 계산하지 않는 기법.
    answer: Memoization
    answerDisplay: 메모이제이션[Memoization]
    example: 무거운 목록 계산은 메모이제이션[Memoization]을 쓰자.
  - id: fe-optimistic-update
    section: 렌더링 / 컴포넌트
    title: 낙관적 업데이트
    prompt: 서버 응답 전에 성공을 가정해 화면을 먼저 바꾸는 방식.
    answer: Optimistic Update
    answerDisplay: 낙관적 업데이트[Optimistic Update]
    example: 좋아요는 낙관적 업데이트[Optimistic Update]로 처리한다.
  - id: fe-tree-shaking
    section: 렌더링 / 컴포넌트
    title: 트리 셰이킹
    prompt: 번들에서 쓰지 않는 코드를 제거하는 최적화.
    answer: Tree Shaking
    answerDisplay: 트리 셰이킹[Tree Shaking]
    example: 트리 셰이킹[Tree Shaking]이 되도록 ESM으로 가져오자.
  - id: fe-polyfill
    section: 렌더링 / 컴포넌트
    title: 폴리필
    prompt: 구형 브라우저에 없는 기능을 코드로 채워 주는 것.
    answer: Polyfill
    answerDisplay: 폴리필[Polyfill]
    example: 구형 브라우저용 폴리필[Polyfill]을 넣었다.
  - id: fe-accessibility
    section: 렌더링 / 컴포넌트
    title: 접근성
    prompt: 장애가 있어도 누구나 쓸 수 있게 만드는 품질.
    answer: Accessibility
    answerDisplay: 접근성[Accessibility]
    example: 모달은 접근성[Accessibility]상 포커스 이동이 필요하다.
  - id: fe-responsive
    section: 렌더링 / 컴포넌트
    title: 반응형
    prompt: 화면 크기에 맞춰 레이아웃이 바뀌는 설계.
    answer: Responsive
    answerDisplay: 반응형[Responsive]
    example: 표는 반응형[Responsive]에서 카드로 바뀐다.
