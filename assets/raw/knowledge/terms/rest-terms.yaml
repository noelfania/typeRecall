id: rule-rest-readme-rest
category: knowledge
kind: term
topic: rest
title: REST 실무 용어
source:
  origin: assets/typingSource/Rule-REST/README-REST.md
terms:
  - id: rule-rest-readme-rest-term-1
    section: HTTP 기본
    title: 요청
    prompt: 클라이언트가 서버에 보내는 요청 전체.
    answer: Request
    answerDisplay: 요청[Request]
    example: 로그인 요청[Request]에는 보통 헤더와 바디가 함께 들어간다.
  - id: rule-rest-readme-rest-term-2
    section: HTTP 기본
    title: 응답
    prompt: 서버가 클라이언트에게 돌려주는 응답 전체.
    answer: Response
    answerDisplay: 응답[Response]
    example: 성공 시 응답[Response] 바디에 사용자 정보를 내려준다.
  - id: rule-rest-readme-rest-term-3
    section: HTTP 기본
    title: 헤더
    prompt: 요청이나 응답의 부가 정보를 담는 메타데이터 영역.
    answer: Header
    answerDisplay: 헤더[Header]
    example: "`Authorization`은 대표적인 요청 헤더[Header]다."
  - id: rule-rest-readme-rest-term-4
    section: HTTP 기본
    title: 바디
    prompt: 실제 데이터 본문을 담는 영역.
    answer: Body
    answerDisplay: 바디[Body]
    example: POST 요청의 바디[Body]에는 JSON 데이터를 넣는다.
  - id: rule-rest-readme-rest-term-5
    section: HTTP 기본
    title: 상태 코드
    prompt: 응답 결과를 숫자로 표현하는 규약.
    answer: Status Code
    answerDisplay: 상태 코드[Status Code]
    example: 정상 조회면 `200`, 생성 성공이면 `201`을 쓴다.
  - id: rule-rest-readme-rest-term-6
    section: HTTP 기본
    title: 엔드포인트
    prompt: 서버 자원을 식별하는 주소.
    answer: Endpoint
    answerDisplay: 엔드포인트[Endpoint]
    example: 사용자 목록 엔드포인트[Endpoint]는 `/users`일 수 있다.
  - id: rule-rest-readme-rest-term-7
    section: HTTP 메서드
    title: 조회
    prompt: 데이터를 조회할 때 쓰는 메서드.
    answer: GET
    answerDisplay: 조회[GET]
    example: 사용자 목록 조회[GET]는 보통 `/users`로 요청한다.
  - id: rule-rest-readme-rest-term-8
    section: HTTP 메서드
    title: 생성
    prompt: 새 데이터를 만들 때 쓰는 메서드.
    answer: POST
    answerDisplay: 생성[POST]
    example: 회원 가입 생성[POST] 요청은 `/users`로 보낼 수 있다.
  - id: rule-rest-readme-rest-term-9
    section: HTTP 메서드
    title: 수정
    prompt: 기존 데이터를 전체 수정할 때 자주 쓰는 메서드.
    answer: PUT
    answerDisplay: 수정[PUT]
    example: 프로필 전체 수정[PUT]은 전체 필드를 보내는 편이다.
  - id: rule-rest-readme-rest-term-10
    section: HTTP 메서드
    title: 부분 수정
    prompt: 기존 데이터를 일부 수정할 때 자주 쓰는 메서드.
    answer: PATCH
    answerDisplay: 부분 수정[PATCH]
    example: 닉네임만 바꿀 때는 부분 수정[PATCH]가 자연스럽다.
  - id: rule-rest-readme-rest-term-11
    section: HTTP 메서드
    title: 삭제
    prompt: 데이터를 삭제할 때 쓰는 메서드.
    answer: DELETE
    answerDisplay: 삭제[DELETE]
    example: 계정 삭제[DELETE] 요청은 `/users/1`처럼 보낼 수 있다.
  - id: rule-rest-readme-rest-term-12
    section: 자주 보는 상태 코드
    title: 성공
    prompt: 요청이 정상적으로 처리되었음을 뜻하는 코드.
    answer: 200 OK
    answerDisplay: 성공[200 OK]
    example: 목록 조회 성공이면 `200 OK`를 반환한다.
  - id: rule-rest-readme-rest-term-13
    section: 자주 보는 상태 코드
    title: 생성 완료
    prompt: 새 리소스가 생성되었음을 뜻하는 코드.
    answer: 201 Created
    answerDisplay: 생성 완료[201 Created]
    example: 게시글 작성 성공 후 `201 Created`를 내려준다.
  - id: rule-rest-readme-rest-term-14
    section: 자주 보는 상태 코드
    title: 잘못된 요청
    prompt: 잘못된 요청 형식이나 유효성 오류를 뜻하는 코드.
    answer: 400 Bad Request
    answerDisplay: 잘못된 요청[400 Bad Request]
    example: 필수 값이 빠지면 `400 Bad Request`를 반환한다.
  - id: rule-rest-readme-rest-term-15
    section: 자주 보는 상태 코드
    title: 인증 실패
    prompt: 인증 정보가 없거나 잘못된 상태를 뜻하는 코드.
    answer: 401 Unauthorized
    answerDisplay: 인증 실패[401 Unauthorized]
    example: 토큰이 없으면 `401 Unauthorized`를 내려준다.
  - id: rule-rest-readme-rest-term-16
    section: 자주 보는 상태 코드
    title: 권한 없음
    prompt: 권한은 있지만 해당 작업이 허용되지 않음을 뜻하는 코드.
    answer: 403 Forbidden
    answerDisplay: 권한 없음[403 Forbidden]
    example: 일반 유저가 관리자 API를 호출하면 `403 Forbidden`이다.
  - id: rule-rest-readme-rest-term-17
    section: 자주 보는 상태 코드
    title: 찾을 수 없음
    prompt: 요청한 자원이 존재하지 않음을 뜻하는 코드.
    answer: 404 Not Found
    answerDisplay: 찾을 수 없음[404 Not Found]
    example: 없는 게시글 ID면 `404 Not Found`를 반환한다.
  - id: rule-rest-readme-rest-term-18
    section: 자주 보는 상태 코드
    title: 서버 오류
    prompt: 서버 내부 오류를 뜻하는 코드.
    answer: 500 Internal Server Error
    answerDisplay: 서버 오류[500 Internal Server Error]
    example: 처리 중 예외가 나면 `500 Internal Server Error`가 날 수 있다.
  - id: rule-rest-readme-rest-term-19
    section: 인증 / 세션 / 토큰
    title: 쿠키
    prompt: 브라우저에 저장되고 요청마다 자동으로 전송될 수 있는 작은 데이터 조각.
    answer: Cookie
    answerDisplay: 쿠키[Cookie]
    example: 세션 기반 로그인에서는 쿠키[Cookie]에 세션 식별자를 담는다.
  - id: rule-rest-readme-rest-term-20
    section: 인증 / 세션 / 토큰
    title: 세션
    prompt: 서버가 사용자 로그인 상태를 저장해 두는 방식.
    answer: Session
    answerDisplay: 세션[Session]
    example: 서버는 세션[Session] 저장소에서 로그인 상태를 확인한다.
  - id: rule-rest-readme-rest-term-21
    section: 인증 / 세션 / 토큰
    title: 토큰 인증
    prompt: 서버가 상태를 저장하지 않고, 클라이언트가 토큰을 보관하는 방식.
    answer: Token Authentication
    answerDisplay: 토큰 인증[Token Authentication]
    example: 모바일 앱은 토큰 인증[Token Authentication]을 많이 쓴다.
  - id: rule-rest-readme-rest-term-22
    section: 인증 / 세션 / 토큰
    title: 제이더블유티
    prompt: JSON 형태로 서명된 토큰을 이용하는 인증 방식.
    answer: JWT
    answerDisplay: 제이더블유티[JWT]
    example: 로그인 성공 후 JWT를 발급해서 API 호출에 사용한다.
  - id: rule-rest-readme-rest-term-23
    section: 인증 / 세션 / 토큰
    title: 베어러 토큰
    prompt: 인증 정보를 요청 헤더에 넣어 보내는 방식.
    answer: Bearer Token
    answerDisplay: 베어러 토큰[Bearer Token]
    example: "`Authorization: Bearer <token>` 형식으로 보낸다."
  - id: rule-rest-readme-rest-term-24
    section: CORS / 브라우저 보안
    title: 동일 출처 정책
    prompt: 브라우저가 다른 출처 간 요청을 제한하는 보안 정책.
    answer: Same-Origin Policy
    answerDisplay: 동일 출처 정책[Same-Origin Policy]
    example: 포트가 다르면 동일 출처 정책[Same-Origin Policy]에 걸릴 수 있다.
  - id: rule-rest-readme-rest-term-25
    section: CORS / 브라우저 보안
    title: 교차 출처 리소스 공유
    prompt: 다른 출처 요청을 허용할지 정하는 브라우저 보안 규칙.
    answer: CORS
    answerDisplay: 교차 출처 리소스 공유[CORS]
    example: 프론트와 API 서버 도메인이 다르면 CORS 설정이 필요하다.
  - id: rule-rest-readme-rest-term-26
    section: CORS / 브라우저 보안
    title: 프리플라이트 요청
    prompt: 본 요청 전에 브라우저가 미리 보내는 사전 확인 요청.
    answer: Preflight Request
    answerDisplay: 프리플라이트 요청[Preflight Request]
    example: "`OPTIONS` 메서드로 프리플라이트 요청[Preflight Request]이 먼저 간다."
  - id: rule-rest-readme-rest-term-27
    section: CORS / 브라우저 보안
    title: 출처 허용 헤더
    prompt: 서버가 어떤 출처를 허용하는지 알려주는 응답 헤더.
    answer: Access-Control-Allow-Origin
    answerDisplay: 출처 허용 헤더[Access-Control-Allow-Origin]
    example: 개발 환경에서는 `http://localhost:3000`만 허용할 수 있다.
  - id: rule-rest-readme-rest-term-31
    section: 실무 패턴
    title: 페이지네이션
    prompt: 페이지 목록을 여러 조각으로 나눠서 조회하는 패턴.
    answer: Pagination
    answerDisplay: 페이지네이션[Pagination]
    example: "`/posts?page=2&limit=20`처럼 페이지네이션을 건다."
  - id: rule-rest-readme-rest-term-32
    section: 실무 패턴
    title: 멱등성
    prompt: 같은 요청을 여러 번 보내도 결과가 같아야 하는 성질.
    answer: Idempotency
    answerDisplay: 멱등성[Idempotency]
    example: 같은 삭제 요청을 두 번 보내도 최종 상태는 같아야 한다.
  - id: rest-content-type
    section: 주요 헤더
    title: Content-Type
    prompt: 요청·응답 바디의 데이터 형식을 알려 주는 헤더. JSON이면 application/json을 쓴다.
    answer: Content-Type
    example: POST JSON을 보낼 때 Content-Type을 application/json으로 둔다.
  - id: rest-authorization
    section: 주요 헤더
    title: Authorization
    prompt: 로그인 토큰 등 인증 정보를 담는 요청 헤더. Bearer 토큰과 함께 자주 쓴다.
    answer: Authorization
    example: Authorization 헤더에 Bearer 토큰을 넣어 API를 호출한다.
  - id: rest-accept
    section: 주요 헤더
    title: Accept
    prompt: 클라이언트가 받고 싶은 응답 형식을 서버에 알리는 헤더.
    answer: Accept
    example: Accept에 application/json을 넣으면 JSON 응답을 기대한다는 뜻이다.
  - id: rest-application-json
    section: 바디 전송 방식
    title: JSON 바디
    prompt: 본문을 JSON으로 보내는 가장 흔한 REST 방식. Content-Type은 application/json.
    answer: application/json
    aliases:
      - JSON Body
    example: 로그인 API는 보통 application/json으로 id와 pw를 보낸다.
  - id: rest-form-urlencoded
    section: 바디 전송 방식
    title: 폼 URL 인코딩
    prompt: HTML form처럼 key=value&... 형태로 바디를 보내는 방식.
    answer: application/x-www-form-urlencoded
    aliases:
      - Form URL Encoded
    example: 전통적인 로그인 form은 application/x-www-form-urlencoded를 쓴다.
  - id: rest-multipart
    section: 바디 전송 방식
    title: 멀티파트
    prompt: 파일 업로드처럼 텍스트와 바이너리를 한 요청에 섞어 보낼 때 쓰는 바디 형식.
    answer: multipart/form-data
    aliases:
      - Multipart
    example: 프로필 이미지 업로드는 multipart/form-data로 보낸다.
  - id: rest-local-storage
    section: 브라우저 저장소
    title: 로컬 스토리지
    prompt: 브라우저에 장기 저장하는 키-값 저장소. 탭을 닫아도 남고, 요청에 자동으로 안 붙는다.
    answer: localStorage
    example: JWT를 localStorage에 두고 Authorization 헤더에 직접 넣는다.
  - id: rest-session-storage
    section: 브라우저 저장소
    title: 세션 스토리지
    prompt: 탭(세션)이 열려 있는 동안만 유지되는 브라우저 키-값 저장소.
    answer: sessionStorage
    example: 임시 입력값은 sessionStorage에 두면 탭을 닫을 때 사라진다.
  - id: rest-httponly
    section: 브라우저 저장소
    title: HttpOnly 쿠키
    prompt: JavaScript에서 읽지 못하게 막아 XSS로 토큰이 훔쳐지기 어렵게 하는 쿠키 옵션.
    answer: HttpOnly
    aliases:
      - httpOnly
    example: 세션 쿠키는 httpOnly로 심어 document.cookie로 못 읽게 한다.
  - id: rest-options
    section: HTTP 메서드
    title: OPTIONS
    prompt: CORS 프리플라이트처럼 본 요청 전에 허용 여부를 묻는 데 쓰는 메서드.
    answer: OPTIONS
    example: 브라우저가 먼저 OPTIONS로 서버 CORS 허용을 확인한다.
  - id: rest-credentials
    section: CORS / 브라우저 보안
    title: credentials
    prompt: 교차 출처 요청에 쿠키를 포함할지 정하는 옵션. 서버도 Allow-Credentials를 허용해야 한다.
    answer: credentials
    aliases:
      - Access-Control-Allow-Credentials
    example: fetch에 credentials include와 서버 CORS credentials true를 맞춘다.
  - id: rest-openapi
    section: API 계약
    title: OpenAPI
    prompt: REST API의 경로·메서드·스키마·응답을 기계가 읽을 수 있게 기술하는 명세 표준. Swagger UI와 함께 쓴다.
    answer: OpenAPI
    answerDisplay: OpenAPI[OpenAPI / Swagger]
    aliases:
      - Swagger
      - OpenAPI Spec
    example: 프론트는 OpenAPI 스키마로 타입과 목을 맞춘다.
  - id: rest-api-contract
    section: API 계약
    title: API 계약
    prompt: 프론트와 백엔드가 합의한 요청·응답·에러 규칙. 명세가 바뀌면 양쪽이 같이 맞춘다.
    answer: API Contract
    answerDisplay: API 계약[API Contract]
    aliases:
      - Contract
    example: 필드명을 바꾸기 전에 API Contract를 먼저 갱신한다.
  - id: rest-status-204
    section: 자주 보는 상태 코드
    title: 내용 없음
    prompt: 성공했지만 돌려줄 본문이 없다는 상태 코드.
    answer: 204 No Content
    answerDisplay: 내용 없음[204 No Content]
    example: 삭제 성공은 내용 없음[204 No Content]으로 응답한다.
  - id: rest-status-304
    section: 자주 보는 상태 코드
    title: 변경 없음
    prompt: 캐시한 내용을 그대로 써도 된다는 상태 코드.
    answer: 304 Not Modified
    answerDisplay: 변경 없음[304 Not Modified]
    example: 변경 없음[304 Not Modified]이면 본문을 받지 않는다.
  - id: rest-status-409
    section: 자주 보는 상태 코드
    title: 충돌
    prompt: 현재 자원 상태와 맞지 않아 처리할 수 없다는 상태 코드.
    answer: 409 Conflict
    answerDisplay: 충돌[409 Conflict]
    example: 이메일이 중복되면 충돌[409 Conflict]을 돌려준다.
  - id: rest-status-422
    section: 자주 보는 상태 코드
    title: 처리 불가 내용
    prompt: 형식은 맞지만 값이 규칙에 어긋난다는 상태 코드.
    answer: 422 Unprocessable Entity
    answerDisplay: 처리 불가 내용[422 Unprocessable Entity]
    example: 검증 실패는 처리 불가 내용[422 Unprocessable Entity]으로 준다.
  - id: rest-status-429
    section: 자주 보는 상태 코드
    title: 요청 과다
    prompt: 정해진 한도를 넘겨 요청했다는 상태 코드.
    answer: 429 Too Many Requests
    answerDisplay: 요청 과다[429 Too Many Requests]
    example: 요청 과다[429 Too Many Requests]면 잠시 뒤 재시도한다.
  - id: rest-status-502
    section: 자주 보는 상태 코드
    title: 잘못된 게이트웨이
    prompt: 프록시가 상위 서버에서 잘못된 응답을 받았다는 상태 코드.
    answer: 502 Bad Gateway
    answerDisplay: 잘못된 게이트웨이[502 Bad Gateway]
    example: 앱 서버가 죽어 잘못된 게이트웨이[502 Bad Gateway]가 났다.
  - id: rest-status-503
    section: 자주 보는 상태 코드
    title: 서비스 이용 불가
    prompt: 과부하나 점검으로 지금 처리할 수 없다는 상태 코드.
    answer: 503 Service Unavailable
    answerDisplay: 서비스 이용 불가[503 Service Unavailable]
    example: 점검 중에는 서비스 이용 불가[503 Service Unavailable]를 준다.
  - id: rest-security-authentication
    section: 보안
    title: 인증
    prompt: 요청한 사람이 누구인지 확인하는 것. 실패하면 401.
    answer: Authentication
    answerDisplay: 인증[Authentication]
    example: 토큰이 만료되면 인증[Authentication]부터 실패한다.
  - id: rest-security-authorization
    section: 보안
    title: 인가
    prompt: 확인된 사용자가 그 일을 할 권한이 있는지 판단하는 것. 실패하면 403.
    answer: Authorization
    answerDisplay: 인가[Authorization]
    example: 로그인했어도 인가[Authorization]가 없으면 403이다.
  - id: rest-security-oauth
    section: 보안
    title: 오어스
    prompt: 비밀번호를 넘기지 않고 다른 서비스에 권한을 위임하는 표준.
    answer: OAuth
    answerDisplay: 오어스[OAuth]
    example: 구글 로그인은 오어스[OAuth]로 연동한다.
  - id: rest-security-sso
    section: 보안
    title: 통합 로그인
    prompt: 한 번 로그인으로 여러 서비스를 쓰게 하는 방식.
    answer: SSO
    answerDisplay: 통합 로그인[SSO]
    example: 사내 도구는 통합 로그인[SSO]으로 묶었다.
  - id: rest-security-refresh-token
    section: 보안
    title: 리프레시 토큰
    prompt: 만료된 액세스 토큰을 다시 발급받는 데 쓰는 토큰.
    answer: Refresh Token
    answerDisplay: 리프레시 토큰[Refresh Token]
    example: 리프레시 토큰[Refresh Token]은 HttpOnly 쿠키에 둔다.
  - id: rest-security-xss
    section: 보안
    title: 교차 사이트 스크립팅
    prompt: 공격자의 스크립트가 다른 사용자의 브라우저에서 실행되는 공격.
    answer: XSS
    answerDisplay: 교차 사이트 스크립팅[XSS]
    example: 사용자 입력을 그대로 그리면 교차 사이트 스크립팅[XSS]에 뚫린다.
  - id: rest-security-csrf
    section: 보안
    title: 교차 사이트 요청 위조
    prompt: 로그인된 사용자의 브라우저로 원치 않는 요청을 보내게 하는 공격.
    answer: CSRF
    answerDisplay: 교차 사이트 요청 위조[CSRF]
    example: 쿠키 인증이면 교차 사이트 요청 위조[CSRF] 방어가 필요하다.
  - id: rest-security-sql-injection
    section: 보안
    title: SQL 삽입
    prompt: 입력값으로 쿼리 구조를 바꿔 DB를 조작하는 공격.
    answer: SQL Injection
    answerDisplay: SQL 삽입[SQL Injection]
    example: 파라미터 바인딩으로 SQL 삽입[SQL Injection]을 막는다.
  - id: rest-security-hashing
    section: 보안
    title: 해싱
    prompt: 원문을 되돌릴 수 없는 고정 길이 값으로 바꾸는 것.
    answer: Hashing
    answerDisplay: 해싱[Hashing]
    example: 비밀번호는 암호화가 아니라 해싱[Hashing]해서 저장한다.
  - id: rest-network-https
    section: 네트워크
    title: 보안 HTTP
    prompt: TLS로 통신 내용을 암호화한 HTTP.
    answer: HTTPS
    answerDisplay: 보안 HTTP[HTTPS]
    example: 쿠키의 Secure 옵션은 보안 HTTP[HTTPS]에서만 전송된다.
  - id: rest-network-dns
    section: 네트워크
    title: 도메인 이름 시스템
    prompt: 도메인 이름을 IP 주소로 바꿔 주는 시스템.
    answer: DNS
    answerDisplay: 도메인 이름 시스템[DNS]
    example: 도메인을 옮긴 뒤 도메인 이름 시스템[DNS] 전파를 기다렸다.
  - id: rest-network-cdn
    section: 네트워크
    title: 콘텐츠 전송 네트워크
    prompt: 사용자와 가까운 서버에서 정적 파일을 내려 주는 네트워크.
    answer: CDN
    answerDisplay: 콘텐츠 전송 네트워크[CDN]
    example: 이미지는 콘텐츠 전송 네트워크[CDN]로 서빙한다.
  - id: rest-network-websocket
    section: 네트워크
    title: 웹소켓
    prompt: 서버와 클라이언트가 연결을 유지하며 양방향으로 통신하는 프로토콜.
    answer: WebSocket
    answerDisplay: 웹소켓[WebSocket]
    example: 채팅은 웹소켓[WebSocket]으로 구현했다.
  - id: rest-network-polling
    section: 네트워크
    title: 폴링
    prompt: 변경이 있는지 일정 간격으로 서버에 계속 묻는 방식.
    answer: Polling
    answerDisplay: 폴링[Polling]
    example: 처리 상태는 5초 폴링[Polling]으로 확인한다.
