id: knowledge-notes-regex-reference
category: knowledge
kind: note
topic: regex
title: 정규식 참고표 (JavaScript)
source:
  origin: chat-raw 2026-07-04 (https://it-tools.tech/regex-memo)
  note: 타이핑 연습용 예문은 syntax/regex-for-javascript 트랙에 있고, 이 파일은 조회용 참고표다.
sections:
  - title: 일반 문자
    rows:
      - { expression: ". 또는 [^\\n\\r]", description: 줄바꿈을 제외한 아무 문자 }
      - { expression: "[A-Za-z]", description: 알파벳 }
      - { expression: "[a-z]", description: 소문자 알파벳 }
      - { expression: "[A-Z]", description: 대문자 알파벳 }
      - { expression: "\\d 또는 [0-9]", description: 숫자 }
      - { expression: "\\D 또는 [^0-9]", description: 숫자가 아닌 문자 }
      - { expression: "\\w 또는 [A-Za-z0-9_]", description: 알파벳·숫자·밑줄 }
      - { expression: "\\W 또는 [^A-Za-z0-9_]", description: "\\w의 반대" }
      - { expression: "\\S", description: "\\s의 반대 (공백이 아닌 문자)" }
  - title: 공백 문자
    rows:
      - { expression: "\\t", description: 탭 }
      - { expression: "\\n", description: 줄바꿈 }
      - { expression: "\\r", description: 캐리지 리턴 }
      - { expression: "\\s", description: 공백·탭·줄바꿈·캐리지 리턴 }
  - title: 문자 집합
    rows:
      - { expression: "[xyz]", description: x, y, z 중 하나 }
      - { expression: "[^xyz]", description: x, y, z가 아닌 문자 }
      - { expression: "[1-3]", description: 1, 2, 3 중 하나 }
      - { expression: "[^1-3]", description: 1, 2, 3이 아닌 문자 }
    notes: |
      문자 집합[character set]은 대괄호 안 문자들의 OR 연산이다.
      여는 [ 바로 뒤의 ^는 부정을 뜻한다. 집합 안의 .은 글자 그대로 마침표다.
  - title: 이스케이프가 필요한 문자
    rows:
      - { expression: "집합 밖", description: "\\. \\^ \\$ \\| \\\\ \\/ \\( \\) \\[ \\] \\{ \\}" }
      - { expression: "집합 안", description: "\\\\ 와 \\] 만 필수" }
    notes: |
      ^는 집합의 여는 [ 바로 뒤에 올 때만, -는 알파벳이나 숫자 사이에 올 때만 이스케이프한다.
  - title: 수량자
    rows:
      - { expression: "{2}", description: 정확히 2개 }
      - { expression: "{2,}", description: 2개 이상 }
      - { expression: "{2,7}", description: 2개 이상 7개 이하 }
      - { expression: "*", description: 0개 이상 }
      - { expression: "+", description: 1개 이상 }
      - { expression: "?", description: 0개 또는 1개 }
    notes: 수량자[quantifier]는 대상 표현식 뒤에 붙인다.
  - title: 경계
    rows:
      - { expression: "^", description: 문자열 시작 }
      - { expression: "$", description: 문자열 끝 }
      - { expression: "\\b", description: "단어 경계[word boundary]" }
    notes: |
      단어 경계는 \w와 \W가 맞닿는 지점, 그리고 문자열 양 끝의 \w 앞뒤에서 매칭된다.
  - title: 매칭 (전후 탐색)
    rows:
      - { expression: "foo|bar", description: foo 또는 bar }
      - { expression: "foo(?=bar)", description: 뒤에 bar가 오는 foo (lookahead) }
      - { expression: "foo(?!bar)", description: 뒤에 bar가 오지 않는 foo }
      - { expression: "(?<=bar)foo", description: 앞에 bar가 있는 foo (lookbehind) }
      - { expression: "(?<!bar)foo", description: 앞에 bar가 없는 foo }
  - title: 그룹과 캡처
    rows:
      - { expression: "(foo)", description: 캡처 그룹 — 매칭하고 저장 }
      - { expression: "(?:foo)", description: 비캡처 그룹 — 매칭만 하고 저장 안 함 }
      - { expression: "(foo)bar\\1", description: "\\1은 첫 캡처 그룹 역참조 — foobarfoo 매칭" }
    notes: |
      캡처 그룹은 string.match, string.matchAll, string.replace(regexp, callback)에서 의미가 있다.
      \N은 N번째 캡처 그룹의 역참조[backreference]이고, 번호는 1부터 시작한다.
