        items: [404 Pages]
      - name: Page Examples
        items: [Landing Pages, Pricing Pages, About Pages]
  - group: Application UI
    categories:
      - name: Application Shells
        items: [Stacked Layouts, Sidebar Layouts, Multi-Column Layouts]
      - name: Headings
        items: [Page Headings, Card Headings, Section Headings]
      - name: Data Display
        items: [Description Lists, Stats, Calendars]
      - name: Lists
        items: [Stacked Lists, Tables, Grid Lists, Feeds]
      - name: Forms
        items: [Form Layouts, Input Groups, Select Menus, Sign-in and Registration, Textareas, Radio Groups, Checkboxes, Toggles, Action Panels, Comboboxes]
      - name: Feedback
        items: [Alerts, Empty States]
      - name: Navigation
        items: [Navbars, Pagination, Tabs, Vertical Navigation, Sidebar Navigation, Breadcrumbs, Progress Bars, Command Palettes]
      - name: Overlays
        items: [Modal Dialogs, Drawers, Notifications]
      - name: Elements
        items: [Avatars, Badges, Dropdowns, Buttons, Button Groups]
      - name: Layout
        items: [Containers, Cards, List containers, Media Objects, Dividers]
      - name: Page Examples
        items: [Home Screens, Detail Screens, Settings Screens]
  - group: Ecommerce
    categories:
