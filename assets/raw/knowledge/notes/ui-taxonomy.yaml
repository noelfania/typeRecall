id: knowledge-notes-ui-taxonomy
category: knowledge
kind: note
topic: web
title: UI 부품 분류 트리 (Tailwind UI Blocks 기준)
source:
  origin: chat-raw 2026-07-04 (tailwindcss.com/plus/ui-blocks, /plus/ui-kit)
  note: 화면 설명·설계 대화에서 통하는 컨벤셔널한 부품 명칭 전체 목록. 카드화된 용어는 terms/web-terms*.yaml 참고.
taxonomy:
  - group: Marketing
    categories:
      - name: Page Sections
        items: [Hero Sections, Feature Sections, CTA Sections, Bento Grids, Pricing Sections, Header Sections, Newsletter Sections, Stats, Testimonials, Blog Sections, Contact Sections, Team Sections, Content Sections, Logo Clouds, FAQs, Footers]
      - name: Elements
        items: [Headers, Flyout Menus, Banners]
      - name: Feedback
        items: [404 Pages]
      - name: Page Examples
        items: [Landing Pages, Pricing Pages, About Pages]
  - group: Application UI
    categories:
      - name: Application Shells
        items: [Stacked Layouts, Sidebar Layouts, Multi-Column Layouts]
      - name: Headings
        items: [Page Headings, Card Headings, Section Headings]
      - name: Data Display
        items: [Description Lists, Stats, Calendars]
      - name: Lists
        items: [Stacked Lists, Tables, Grid Lists, Feeds]
      - name: Forms
        items: [Form Layouts, Input Groups, Select Menus, Sign-in and Registration, Textareas, Radio Groups, Checkboxes, Toggles, Action Panels, Comboboxes]
      - name: Feedback
        items: [Alerts, Empty States]
      - name: Navigation
        items: [Navbars, Pagination, Tabs, Vertical Navigation, Sidebar Navigation, Breadcrumbs, Progress Bars, Command Palettes]
      - name: Overlays
        items: [Modal Dialogs, Drawers, Notifications]
      - name: Elements
        items: [Avatars, Badges, Dropdowns, Buttons, Button Groups]
      - name: Layout
        items: [Containers, Cards, List containers, Media Objects, Dividers]
      - name: Page Examples
        items: [Home Screens, Detail Screens, Settings Screens]
  - group: Ecommerce
    categories:
      - name: Components
        items: [Product Overviews, Product Lists, Category Previews, Shopping Carts, Category Filters, Product Quickviews, Product Features, Store Navigation, Promo Sections, Checkout Forms, Reviews, Order Summaries, Order History, Incentives]
      - name: Page Examples
        items: [Storefront Pages, Product Pages, Category Pages, Shopping Cart Pages, Checkout Pages, Order Detail Pages, Order History Pages]
  - group: Interactive Elements
    categories:
      - name: Elements
        items: [Autocomplete, Command palette, Copy button, Dialog, Disclosure, Dropdown menu, Popover, Select, Tabs]
  - group: UI Kit Components
    categories:
      - name: Components
        items: [Button, Input, Table, Sidebar, Checkbox, Combobox, Radio groups, Switch, Description list, Badge, Listbox, Pagination, Dropdown, Alert, Navbar, Avatar, Divider, Textarea, Heading, Text, Fieldset, Dialog, Sidebar layout, Stacked layout, Auth layout]

# 마케팅 랜딩에서 섹션을 역할로 묶을 때 쓰는 관례
roleGroups:
  - role: Introduction
    label: 소개
    items: [Hero, About, Content]
  - role: Trust
    label: 신뢰
    items: [Logo Cloud, Testimonials, Stats]
  - role: Function
    label: 기능
    items: [Features, Bento Grid]
  - role: Sales
    label: 판매
    items: [Pricing, CTA]
  - role: Support
    label: 지원
    items: [FAQ, Contact, Newsletter]
  - role: Common
    label: 공통 UI
    items: [Header, Footer, Banner, Flyout Menu, Navigation, Sidebar]

# MUI 카테고리 요약 (고빈도만 · 카드화된 용어는 terms/web-terms.yaml)
muiCategories:
  - name: Inputs
    items: [Autocomplete, Button Group, Rating, Switch, Toggle Button, Date Picker]
  - name: Data Display
    items: [Avatar, Chip, Divider, Tooltip, Typography, Data Grid]
  - name: Feedback
    items: [Alert, Progress, Skeleton, Toast/Snackbar]
  - name: Surfaces
    items: [App Bar, Paper, Accordion, Card]
  - name: Navigation
    items: [Bottom Navigation, Breadcrumbs, Link, Menu, Stepper, Tabs, Drawer]
  - name: Layout
    items: [Stack, Container]
  - name: Utils
    items: [Popover, Modal Dialog]

# 고빈도 섹션 (★ 많을수록 거의 모든 사이트)
frequency:
  - { name: Header, stars: 5 }
  - { name: Hero, stars: 5 }
  - { name: Feature, stars: 5 }
  - { name: CTA, stars: 5 }
  - { name: Footer, stars: 5 }
  - { name: Pricing, stars: 4 }
  - { name: FAQ, stars: 4 }
  - { name: Testimonials, stars: 4 }
  - { name: Contact, stars: 4 }
  - { name: Stats, stars: 3 }
  - { name: Logo Cloud, stars: 3 }
  - { name: Newsletter, stars: 3 }
  - { name: Team, stars: 2 }
  - { name: Bento Grid, stars: 2 }
