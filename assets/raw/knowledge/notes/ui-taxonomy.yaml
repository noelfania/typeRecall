id: knowledge-notes-ui-taxonomy
category: knowledge
kind: note
topic: web
title: UI 부품 분류 트리 (Tailwind UI Blocks 기준)
source:
  origin: chat-raw 2026-07-04 (tailwindcss.com/plus/ui-blocks, /plus/ui-kit)
  note: 화면 설명·설계 대화에서 통하는 컨벤셔널한 부품 명칭 전체 목록. 카드화된 용어는 terms/web-terms*.yaml 참고.
taxonomy:
  - group: Marketing
    categories:
      - name: Page Sections
        items: [Hero Sections, Feature Sections, CTA Sections, Bento Grids, Pricing Sections, Header Sections, Newsletter Sections, Stats, Testimonials, Blog Sections, Contact Sections, Team Sections, Content Sections, Logo Clouds, FAQs, Footers]
