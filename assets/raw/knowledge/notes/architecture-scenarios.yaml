id: knowledge-notes-architecture-scenarios
category: knowledge
kind: note
topic: architecture
title: 아키텍처 판단 시나리오 (고빈도만)
source:
  origin: architecture-training-roadmap 2026-07-24
  note: |
    정답 암기가 아니라 기본안 + 탈락 조건.
    context·symptom은 화면 상세·OpenAPI·상태 UI 등 설계 산출물 톤으로 적는다.
    헷갈리는 묶음 지도: notes/architecture-boundary-map.yaml
    용어 카드: terms/architecture-terms.yaml · terms/frontend-terms.yaml
scope: |
  ✅ 화면·업무 증상 → 후보 패턴 비교 → 기본안·whenAvoid
  ✅ BFF·Gateway·Nested Query·배포 단위·Headless·Federation
  ❌ 자격증 전 범위, Saga 등 시나리오 미작성 패턴
  참고: CQRS·N+1 등은 terms 카드만. 비교 표는 architecture-boundary-map.yaml.
relatedNoteIds:
  - knowledge-notes-architecture-boundary-map
scenarios:
  - id: arch-sc-waterfall-bundle
    title: 클라이언트 워터폴을 서버에서 묶기
    context: |
      주문 상세 화면 설계서에 헤더(주문번호·상태)·상품 라인·배송지·결제수단이 한 뷰로 잡혀 있다.
      OpenAPI에는 GET /orders/{id}, /order-items, /shipments, /payments 가 각각 있고,
      Figma에는 Loading 스켈레톤 후 영역별 순차 채움으로 그려져 있다.
    symptom: |
      FE가 주문 응답의 id로 나머지를 이어 호출해 요청 워터폴[Request Waterfall]이 길다.
      첫 페인트는 빠르지만 하단 영역 Empty→Loading이 계단처럼 이어진다.
    options:
      - id: nested-query
        label: Nested Query
        whenPreferred: 한 API(또는 한 쿼리)에서 연관 데이터를 깊게 묶어 줄 수 있을 때.
        whenAvoid: 도메인이 여러 배포 단위로 갈라져 단일 쿼리 경계가 없을 때.
      - id: bff
        label: BFF
        whenPreferred: 웹·앱 화면 단위로 응답 형태를 맞추는 전용 백엔드가 필요할 때.
        whenAvoid: 모든 클라이언트·서비스에 동일한 공통 API만으로 충분할 때.
      - id: client-parallel
        label: 클라이언트 병렬 호출 유지
        whenPreferred: 호출이 독립적이고 워터폴이 아닌 단순 병렬이며, 서버 합칠 이득이 작을 때.
        whenAvoid: 호출이 서로 의존해 대기 시간이 계단처럼 쌓일 때.
    defaultPick: bff
    rationale: 화면 전용 DTO로 맞추면 BFF가 기본안. 백엔드가 하나면 Nested Query로 같은 효과를 낼 수 있다.
    relatedTermIds:
      - arch-request-waterfall
      - arch-nested-query
      - arch-bff

  - id: arch-sc-bff-vs-gateway
    title: BFF와 API Gateway 중 어디를 둘까
    context: |
      웹 상세설계와 앱 상세설계의 필드·섹션이 다르다(웹은 리뷰 탭, 앱은 하단 시트).
      API 계약은 서비스별로 열려 있고, 공통으로는 인증·라우팅만 Gateway 초안이 있다.
    symptom: |
      화면별 조합·필드 rename이 FE에 남거나, Gateway에 “화면용 조립”까지 넣자는 의견이 섞인다.
      API Contract와 화면 명세가 한곳에서 안 만난다.
    options:
      - id: bff
        label: BFF
        whenPreferred: 클라이언트(웹/앱)별로 응답을 모아 형태를 맞출 때.
        whenAvoid: 인증·라우팅만 공통화하면 되고 화면 조합이 거의 없을 때.
      - id: api-gateway
        label: API Gateway
        whenPreferred: 라우팅·인증·제한 등 횡단 관심사를 한곳에서 처리할 때.
        whenAvoid: 화면용 데이터 조립까지 Gateway에 넣으려 할 때(책임이 비대해짐).
      - id: both
        label: Gateway + BFF
        whenPreferred: 공통 진입은 Gateway, 화면 조립은 클라이언트별 BFF로 나눌 때.
        whenAvoid: 팀·트래픽 규모가 작아 계층이 운영 부담만 키울 때.
    defaultPick: both
    rationale: Gateway는 횡단, BFF는 화면 조립. 웹/앱 명세가 갈라지면 둘을 나누는 편이 경계가 맑다.
    relatedTermIds:
      - arch-bff
      - arch-api-gateway
      - arch-microservice

  - id: arch-sc-deploy-unit
    title: 초기 제품의 배포 단위
    context: |
      신규 프로젝트 폴더 초안에 user·order·payment feature가 있고,
      화면 상세는 출시 MVP 10화면, API는 한 OpenAPI 문서로 관리할 예정이다.
      팀은 소수라 배포 파이프라인은 하나다.
    symptom: |
      “처음부터 서비스로 쪼개자”와 “한 배포로 먼저 내자”가 기본설계에서 충돌한다.
      경계는 그려져 있지만 독립 배포·관측 비용 근거는 아직 없다.
    options:
      - id: monolith
        label: Monolith
        whenPreferred: 출시 속도·운영 단순이 최우선이고 경계가 아직 흔들릴 때.
        whenAvoid: 팀·배포 주기가 이미 충돌하고 독립 스케일이 필요할 때.
      - id: modular-monolith
        label: Modular monolith
        whenPreferred: 배포는 하나로 두되 모듈 경계를 강하게 나눠 나중에 분리할 여지를 남길 때.
        whenAvoid: 모듈 간 DB·트랜잭션을 마구 공유해 경계가 명목만 남을 때.
      - id: microservice
        label: Microservice
        whenPreferred: 독립 배포·스케일·팀 소유가 명확하고 운영 역량이 뒷받침될 때.
        whenAvoid: 초기 제품에서 네트워크·관측·배포 비용이 기능보다 클 때.
    defaultPick: modular-monolith
    rationale: MVP·단일 OpenAPI 단계에서는 Modular monolith로 경계를 연습하고, 증거가 쌓이면 뺀다.
    relatedTermIds:
      - arch-monolith
      - arch-modular-monolith
      - arch-microservice
      - arch-feature-based

  - id: arch-sc-headless
    title: 콘텐츠를 Headless로 둘까
    context: |
      마케팅 랜딩(Figma)·앱 홈·키오스크가 같은 배너·상품 문구를 쓴다.
      채널별 UI 컴포넌트·디자인 토큰은 팀마다 다르고, CMS 초안은 페이지 템플릿형이다.
    symptom: |
      CMS에 화면 레이아웃까지 묶이면 앱·키오스크는 콘텐츠만 빼 쓰기 어렵다.
      “Headless UI 라이브러리”와 “Headless CMS” 말이 회의에서 섞인다.
    options:
      - id: headless
        label: Headless
        whenPreferred: 콘텐츠 API만 공유하고 각 클라이언트가 UI를 가질 때.
        whenAvoid: 단일 웹사이트만 있고 CMS 테마로 충분한 때.
      - id: coupled-cms
        label: 결합형 CMS
        whenPreferred: 한 사이트·한 템플릿으로 빠르게 운영할 때.
        whenAvoid: 앱·다중 채널이 같은 콘텐츠를 각자 렌더해야 할 때.
      - id: headless-ui-lib
        label: Headless UI (컴포넌트)
        whenPreferred: 동작·접근성만 라이브러리에 맡기고 스타일은 디자인 시스템으로 칠할 때.
        whenAvoid: CMS/콘텐츠 아키텍처 선택과 혼동할 때(다른 층의 문제).
    defaultPick: headless
    rationale: 다중 채널·다중 Figma면 Headless CMS가 기본안. Headless UI는 컴포넌트 층이라 별개다.
    relatedTermIds:
      - arch-headless
      - dev-extra-headless-ui

  - id: arch-sc-federation
    title: Schema Federation이 필요한가
    context: |
      상품 상세 화면에 상품·재고·리뷰 섹션이 있고, 팀별로 GraphQL 스키마 초안이 생겼다.
      FE는 “한 번의 중첩 쿼리로 화면을 채우고 싶다”고 하고, BFF REST 조립안도 테이블에 있다.
    symptom: |
      클라이언트가 여러 그래프 결과를 이어 붙이거나, BFF에 조합이 몰린다.
      스키마 소유권·배포 단위는 갈라져 있는데 화면 명세는 하나다.
    options:
      - id: federation
        label: Schema Federation
        whenPreferred: 서비스별 스키마 소유를 유지하면서 게이트웨이 연합 그래프로 중첩 조회할 때.
        whenAvoid: 스키마·팀이 하나이거나 GraphQL 자체가 과한 규모일 때.
      - id: single-graph
        label: 단일 GraphQL 스키마
        whenPreferred: 한 팀·한 배포가 그래프 전체를 소유할 수 있을 때.
        whenAvoid: 서비스 경계·팀 소유가 이미 갈라져 스키마 충돌이 잦을 때.
      - id: rest-bff
        label: REST + BFF
        whenPreferred: GraphQL 없이도 화면 조립만으로 충분한 때.
        whenAvoid: 클라이언트가 필드 단위로 그래프를 깊게 골라야 할 때.
    defaultPick: rest-bff
    rationale: 화면 조립이 목표면 REST+BFF가 싸다. Federation은 스키마·팀 분산이 이미 명확할 때.
    relatedTermIds:
      - arch-schema-federation
      - arch-graphql
      - arch-nested-resolver
      - arch-bff
