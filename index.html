<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="개발 용어와 예문을 타이핑하며 익히고, 아키텍처 판단까지 연습하는 Type Recall"
    />
    <title>Type Recall</title>
    <script>
      try {
        if (localStorage.getItem("gmtl-type-recall-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
